<style>

}

  --acc:#428bf0; --bd:#2b2b3b; --ok:#3fc58c; --bad:#f06a6a; --blue:#6aa2ff; --shadow:0 1px 2px #0006,0 10px 30px -14px #000;
  --scene:#12121c; --scene2:#1b1b2a; --skin:#c79b7c; --skin2:#a97f63; color-scheme:dark}}

.st b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bd);color:var(--fg);font-size:11px}

@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .machine{background:linear-gradient(160deg,#2a2a3a,#1b1b28);border-color:#3a3a4e}}
.brand{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#59657f;margin:0 4px 8px}

.lcd .hud2{position:absolute;right:14px;top:10px;font:600 11px ui-monospace,Menlo,monospace;color:#6dffb4aa}

.score{font-size:54px;font-weight:800;line-height:1;letter-spacing:-.03em} .score small{font-size:15px;color:var(--mfg);font-weight:500}
#sheet{width:100%;height:auto;border-radius:10px;display:block;border:1px solid var(--bd)}

.detail h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:0 0 6px;font-weight:700}
.detail ol,.detail ul{margin:0 0 12px;padding-left:20px} .detail li{margin:4px 0;font-size:14px} .detail p{margin:0 0 12px;font-size:14px;color:var(--mfg)}
.coach{grid-template-columns:minmax(0,1fr) auto}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.opts{display:grid;gap:8px;margin-top:10px}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
@media(max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(180deg,var(--scene),var(--scene2));border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.rtbox{min-height:220px;border-radius:16px;display:grid;place-items:center;text-align:center;padding:20px;background:var(--muted);color:var(--fg);font-size:22px;font-weight:700;border:2px dashed var(--bd);cursor:pointer;user-select:none;transition:background .05s}
.rtbox.wait{background:#fdecec;color:#a33;border-color:#e5484d} .rtbox.go{background:#3fb87f;color:#fff;border-color:#3fb87f} .rtbox.beep{background:#2f6df0;color:#fff;border-color:#2f6df0} .rtbox.bad{background:#fff1d6;color:#8a5b00;border-color:#f2c94c}
.pill:empty{display:none}
.chart{display:grid;gap:4px;justify-items:center;background:#fff;border-radius:12px;padding:12px;color:#111;transition:filter .2s}
.cl{display:flex;align-items:center;gap:14px;background:none;border:1px solid transparent;border-radius:8px;padding:0 10px;cursor:pointer;color:#111;font-family:Georgia,serif;font-weight:700;line-height:1.15}
.cl:hover{border-color:var(--bd)} .cl.on{border-color:var(--acc);background:#fff4e8}
.cl .den{font:600 11px Inter,sans-serif;color:#667;width:38px;text-align:left} .cl .lt{letter-spacing:.2em}
.say{min-height:58px;background:var(--muted);border-radius:12px;padding:12px 14px;font-size:15px}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LEADS=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'];
const LANG={I:0,II:60,III:120,aVR:-150,aVL:-30,aVF:90};
const CH={V1:{p:.06,q:0,r:.25,s:1.1,t:-.1},V2:{p:.08,q:0,r:.5,s:1.0,t:.35},V3:{p:.09,q:.02,r:.8,s:.7,t:.4},V4:{p:.1,q:.05,r:1.3,s:.35,t:.45},V5:{p:.1,q:.1,r:1.4,s:.1,t:.38},V6:{p:.09,q:.1,r:1.1,s:.05,t:.3}};
const RHY=[{k:'nsr',n:'Normal sinus rhythm',hr:[62,92],pr:.16},{k:'tachy',n:'Sinus tachycardia',hr:[108,135],pr:.14},{k:'brady',n:'Sinus bradycardia',hr:[42,54],pr:.18},{k:'af',n:'Atrial fibrillation',hr:[95,150],pr:0},{k:'avb1',n:'First-degree AV block',hr:[60,78],pr:.30}];
const AXES=[{k:'n',n:'Normal axis',a:[30,75]},{k:'lad',n:'Left axis deviation',a:[-60,-35]},{k:'rad',n:'Right axis deviation',a:[105,135]}];
let P,B;
const g=(d,c,s)=>Math.exp(-.5*((d-c)/s)**2);
function genBeats(){B=[];let t=-1.2;const rr0=60/P.hr;while(t<420){const af=P.rhythm.k==='af';const rr=af?rr0*(.5+.95*Math.random()):rr0*(1+(Math.random()-.5)*.04);t+=rr;B.push({t,rr,pr:P.rhythm.pr})}}
function newPatientData(forceNsr){const r=forceNsr?RHY[0]:pick(RHY),a=!forceNsr&&Math.random()>.6?pick(AXES.slice(1)):AXES[0];
  P={rhythm:r,axisK:a,axis:Math.round(rnd(a.a[0],a.a[1])),hr:forceNsr?75:Math.round(rnd(r.hr[0],r.hr[1]))};genBeats();return P}
function lb(t){let lo=0,hi=B.length;while(lo<hi){const m=(lo+hi)>>1;if(B[m].t<t)lo=m+1;else hi=m}return lo}
function params(l,axis){const ax=axis===undefined?P.axis:axis;if(LANG[l]===undefined)return CH[l];
  const a=LANG[l],v=Math.cos((ax-a)*Math.PI/180),d=x=>Math.cos(x*Math.PI/180);
  return{p:.15*d(60-a),q:v>.2?.07:0,r:Math.max(v,0)*1.25+.12,s:Math.max(-v,0)*1.1+.12,t:.35*d(45-a)}}
function beatVal(d,rr,pr,pm,af){let v=-pm.q*g(d,-.028,.008)+pm.r*g(d,0,.011)-pm.s*g(d,.026,.010)+pm.t*g(d,.17+.10*Math.sqrt(rr),.05);if(!af)v+=pm.p*g(d,-pr+.01,.022);return v}
function val(t,pm){let v=0,i=lb(t-.75);for(;i<B.length&&B[i].t<t+.45;i++){const b=B[i];v+=beatVal(t-b.t,b.rr,b.pr,pm,P.rhythm.k==='af')}
  v+=.03*Math.sin(6.28*.22*t);if(P.rhythm.k==='af')v+=.05*Math.sin(6.28*6*t)+.03*Math.sin(6.28*7.3*t+1);
  const n=Math.sin(Math.floor(t*400)*12.9898)*43758.5453;v+=.014*((n-Math.floor(n))-.5);return v}
function drawGrid(c,W,H,pxmm,off,bgc){
  c.fillStyle=bgc||'#fdeff1';c.fillRect(0,0,W,H);const base=W-off,a=((base%pxmm)+pxmm)%pxmm;
  for(let x=a;x<=W+1;x+=pxmm){const k=Math.round((x-base)/pxmm),M=((k%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,H);c.stroke()}
  for(let j=-Math.ceil(H/2/pxmm);j<=Math.ceil(H/2/pxmm);j++){const y=H/2+j*pxmm,M=((j%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(0,Math.round(y)+.5);c.lineTo(W,Math.round(y)+.5);c.stroke()}}
function fitCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,W:r.width,H:r.height}}

/* Shared stepper for every practical. Each simulator passes steps with: t, d, do[], why, tips[], ok(), body(), main(), wire(), msg(). */
function Kit(cfg){
  const app=$('#app');
  app.innerHTML=`<div class="wrap"><header><div><div class="eyebrow">Physiology practical · Virtual lab</div><h1>${cfg.title}</h1><p class="sub">${cfg.sub}</p></div><div class="pill" id="pt"></div></header>
  <div class="steps" id="steps"></div><div id="main"></div>
  <div class="card coach" style="margin-top:18px"><div><div class="pill" id="stepTag"></div><h2 id="cTitle" style="margin-top:8px"></h2><div class="mut" id="cText"></div><div class="msg" id="cMsg"></div><div id="cBody"></div></div>
  <div class="row"><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div></div>`;
  const K={step:0,cfg};
  const det=s=>s.do?`<div class="detail"><div><h3>What to do</h3><ol>${s.do.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>Why it matters</h3><p>${s.why||''}</p>${s.tips&&s.tips.length?`<h3>Examiner's tips</h3><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div></div>`:'';
  K.render=function(keepMain){
    const S=cfg.steps,st=S[K.step];
    $('#steps').innerHTML=S.map((s,i)=>`<div class="st ${i===K.step?'on':i<K.step?'done':''}"><b>${i<K.step?'✓':i+1}</b>${s.short||s.t}</div>`).join('');
    $('#stepTag').textContent=`Step ${K.step+1} of ${S.length}`;$('#cTitle').textContent=st.t;$('#cText').textContent=st.d||'';
    $('#cBody').innerHTML=(st.body?st.body():'')+det(st);
    if(!keepMain){$('#main').innerHTML=st.main?st.main():'';}
    const last=K.step===S.length-1;$('#back').disabled=K.step===0||(st.lockBack&&st.lockBack());$('#next').hidden=last&&!st.next;$('#next').disabled=!(st.ok?st.ok():true);
    const m=st.msg?st.msg():null,el=$('#cMsg');el.className='msg'+(m&&m[1]?' '+m[1]:'');el.textContent=m?m[0]:'';
    if(!keepMain&&st.wire)st.wire();if(st.after)st.after();
  };
  $('#next').addEventListener('click',()=>{const st=cfg.steps[K.step];if(st.ok&&!st.ok())return;if(st.leave)st.leave();K.step++;K.render()});
  $('#back').addEventListener('click',()=>{if(K.step>0){K.step--;K.render()}});
  K.refresh=()=>K.render(true);K.redraw=()=>K.render(false);
  return K;
}
Kit.score=(items,again)=>{const tot=items.reduce((a,i)=>a+i[0],0),mx=items.reduce((a,i)=>a+i[1],0);
  return `<div class="score" style="margin-top:18px">${tot}<small> / ${mx}</small></div><div class="checks">${items.map(([p,m,t])=>`<div class="ck"><span class="${p>=m?'ok':'bad'}">${p>=m?'✓':'✗'}</span><span>${t}${m>1?` (${p} of ${m})`:''}</span></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="again">New subject</button></div>`};
const chipRow=(items,state,key)=>`<div class="row" style="margin-top:12px">${items.map(([k,l])=>`<button class="chip" data-chip="${k}" aria-pressed="${!!state[k]}">${l}</button>`).join('')}</div>`;
const wireChips=(state,cb)=>$$('[data-chip]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.chip]=!state[b.dataset.chip];cb()}));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const NAMES=['Ravi K.','Sneha P.','Imran S.','Anita R.','Mahesh D.','Farah N.','Kiran B.','Lakshmi T.'];
let AC;document.addEventListener('pointerdown',()=>{if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function tone(f,dur,gain){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(gain||.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur+.02)}catch(e){}}

const PRE=[['seat','Seat the subject with the chin on the rest, eye at the centre of the arc'],['cov','Cover the other eye with a pad, no pressure'],['fix','Tell the subject to look steadily at the central white spot and say "yes" when the target appears'],['tar','Use a 5 mm white target and move it from the periphery inwards']];
const TYPES=[{n:'Normal',id:'n'},{n:'Bitemporal hemianopia',id:'bt'},{n:'Right homonymous hemianopia',id:'hr'},{n:'Concentric constriction',id:'cc'}];
const NORM=[90,70,50,55,60,55,70,80];const DIRS=[0,45,90,135,180,225,270,315];
const MC=[['Bitemporal hemianopia is typical of a lesion at…',['Optic chiasma','Optic radiation','Optic nerve'],0],['Homonymous hemianopia is caused by a lesion…',['Behind the chiasma (tract, radiation or cortex)','At the chiasma','In one retina'],0]];
let V,sel;
function limit(eye,i){let k=eye==='R'?i:(8-i)%8;let b=NORM[k]+V.jit[eye][i];const d=DIRS[i],c=Math.cos(d*Math.PI/180);
 if(V.T.id==='bt'){const temporal=eye==='R'?c>.2:c<-.2;if(temporal)return 0}
 if(V.T.id==='hr'&&c>.2)return 0;if(V.T.id==='cc')return Math.round(b*.35);return b}
function newSubject(){V={prep:{},T:pick(TYPES),name:pick(NAMES),age:Math.round(rnd(30,65)),pl:{R:{},L:{}},jit:{R:DIRS.map(()=>Math.round(rnd(-4,4))),L:DIRS.map(()=>Math.round(rnd(-4,4)))},ans:null,q:{},done:0};sel={eye:'R',mer:0,pos:95,seen:false};$('#pt').textContent=`Subject: ${V.name} · ${V.age} y`}
const lab=(eye,i)=>({0:eye==='R'?'Temporal':'Nasal',45:'Upper '+(eye==='R'?'temporal':'nasal'),90:'Upper',135:'Upper '+(eye==='R'?'nasal':'temporal'),180:eye==='R'?'Nasal':'Temporal',225:'Lower '+(eye==='R'?'nasal':'temporal'),270:'Lower',315:'Lower '+(eye==='R'?'temporal':'nasal')}[DIRS[i]]);
function chart(eye){const el=$('#c'+eye);if(!el)return;const{c,W,H}=fitCanvas(el),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim(),cx=W/2,cy=H/2,R=Math.min(W,H)/2-14,P=(r,d)=>[cx+R*r/90*Math.cos(d*Math.PI/180),cy-R*r/90*Math.sin(d*Math.PI/180)];c.clearRect(0,0,W,H);
 c.strokeStyle=css('--bd');c.fillStyle=css('--mfg');c.font='10px Inter';c.textAlign='center';[30,60,90].forEach(r=>{c.beginPath();c.arc(cx,cy,R*r/90,0,7);c.stroke();c.fillText(r+'°',cx+R*r/90*.71+8,cy-R*r/90*.71)});DIRS.forEach(d=>{const[x,y]=P(90,d);c.beginPath();c.moveTo(cx,cy);c.lineTo(x,y);c.stroke()});
 const pl=V.pl[eye];c.strokeStyle=css('--acc');c.fillStyle=css('--acc');c.lineWidth=2.4;const have=DIRS.map((d,i)=>pl[i]!=null?P(pl[i],d):null);const seq=have.filter(Boolean);
 if(seq.length>=2){c.fillStyle='rgba(230,113,35,.15)';c.beginPath();let first=1;have.forEach(p=>{if(!p)return;first?(c.moveTo(p[0],p[1]),first=0):c.lineTo(p[0],p[1])});if(seq.length>=3)c.closePath();c.fill();c.stroke()}
 c.fillStyle=css('--acc');have.forEach(p=>{if(!p)return;c.beginPath();c.arc(p[0],p[1],4.5,0,7);c.fill()});
 if(eye===sel.eye&&!V.done){const[x,y]=P(sel.pos,DIRS[sel.mer]);c.fillStyle='#fff';c.strokeStyle=css('--pri');c.lineWidth=2;c.beginPath();c.arc(x,y,6,0,7);c.fill();c.stroke()}
 c.fillStyle=css('--pri');c.beginPath();c.arc(cx,cy,3.5,0,7);c.fill();c.fillStyle=css('--mfg');c.textAlign='center';c.fillText(eye==='R'?'Right eye (temporal to the right)':'Left eye (temporal to the left)',cx,H-2)}
function say(){const L=limit(sel.eye,sel.mer);return sel.pos<=L&&L>0||(sel.pos<=L)?'seen':'no'}
function main(){const L=limit(sel.eye,sel.mer),seen=sel.pos<=L&&L>0,none=L===0&&sel.pos<=5;
 return `<div class="cols"><div class="stage"><div class="two"><div><canvas id="cR" style="width:100%;height:240px;display:block"></canvas></div><div><canvas id="cL" style="width:100%;height:240px;display:block"></canvas></div></div></div>
 <div class="panel"><div class="row"><span class="lab" style="margin:0">Eye</span><div class="seg" id="eye"><button data-e="R" aria-pressed="${sel.eye==='R'}">Right</button><button data-e="L" aria-pressed="${sel.eye==='L'}">Left</button></div></div><span class="lab" style="margin-top:10px">Meridian</span><div class="row">${DIRS.map((d,i)=>`<button class="chip" data-m="${i}" aria-pressed="${sel.mer===i}">${lab(sel.eye,i)} ${V.pl[sel.eye][i]!=null?'✓':''}</button>`).join('')}</div>
 <div class="say" style="margin-top:12px">Target at <b>${sel.pos}°</b> from fixation along the <b>${lab(sel.eye,sel.mer).toLowerCase()}</b> meridian.<br>${seen?'Subject: <b>"Yes, I see it."</b>':none?'Subject: <b>"I see nothing on this side."</b>':'Subject: <b>"I can\'t see it yet."</b>'}</div>
 <div class="row" style="margin-top:10px"><button class="btn" id="m5" ${sel.pos<=0?'disabled':''}>Move target in 5°</button><button class="btn" id="m15" ${sel.pos<=0?'disabled':''}>15°</button><button class="btn" id="re">Back to periphery</button><button class="btn acc" id="pl" ${V.pl[sel.eye][sel.mer]!=null?'disabled':''}>Plot this point</button></div>
 <p class="mut">Plotted: right ${Object.keys(V.pl.R).length}/8, left ${Object.keys(V.pl.L).length}/8 meridians. Plot at least the four main meridians for each eye.</p></div></div>`}
function wire(){const rd=()=>{K.redraw()};$$('#eye button').forEach(b=>b.onclick=()=>{sel.eye=b.dataset.e;sel.pos=95;rd()});$$('[data-m]').forEach(b=>b.onclick=()=>{sel.mer=+b.dataset.m;sel.pos=95;rd()});
 $('#m5').onclick=()=>{sel.pos=Math.max(0,sel.pos-5);rd()};$('#m15').onclick=()=>{sel.pos=Math.max(0,sel.pos-15);rd()};$('#re').onclick=()=>{sel.pos=95;rd()};$('#pl').onclick=()=>{V.pl[sel.eye][sel.mer]=Math.min(90,sel.pos);K.refresh();rd()};chart('R');chart('L')}
const need=e=>[0,2,4,6].every(i=>V.pl[e][i]!=null);
function report(){return `<div class="panel"><div class="eyebrow">Your charts</div><h2>${V.name}</h2><div class="two"><canvas id="cR" style="width:100%;height:240px;display:block"></canvas><canvas id="cL" style="width:100%;height:240px;display:block"></canvas></div>
 <span class="lab" style="margin-top:12px">Your diagnosis</span><div class="row">${TYPES.map((t,i)=>`<button class="chip" data-d="${i}" aria-pressed="${V.ans===i}" ${V.done?'disabled':''}>${t.n}</button>`).join('')}</div>
 ${MC.map((q,i)=>`<div style="margin-top:12px"><span class="lab">${q[0]}</span><div class="row">${q[1].map((o,j)=>`<button class="chip" data-q="${i}-${j}" aria-pressed="${V.q[i]===j}" ${V.done?'disabled':''}>${o}</button>`).join('')}</div></div>`).join('')}<div class="row" style="margin-top:14px"><button class="btn acc" id="sub" ${V.done?'disabled':''}>Submit to examiner</button></div>${V.done?sc():''}</div>`}
function sc(){const prep=PRE.filter(([k])=>V.prep[k]).length,cov=need('R')&&need('L')?1:0;let ok=0,n=0;['R','L'].forEach(e=>DIRS.forEach((d,i)=>{if(V.pl[e][i]!=null){n++;if(Math.abs(V.pl[e][i]-limit(e,i))<=10)ok++}}));const acc=n&&ok/n>=.8?2:ok/n>=.5?1:0,d=TYPES[V.ans].n===V.T.n?2:0,q=MC.filter((x,i)=>V.q[i]===x[2]).length>=2?1:0;
 return Kit.score([[prep,4,'Preparation'],[cov,1,'All four main meridians plotted in both eyes'],[acc,2,'Plotted limits accurate (within 10°)'],[d,2,'Diagnosis'],[q,1,'Viva questions']])+`<p class="mut" style="margin-top:12px">The subject had: <b>${V.T.n}</b>. Normal field limits (approx.): temporal 90°, inferior 70°, nasal 60°, superior 50°.</p>`}
const K=Kit({title:'Perimetry',sub:'Chart the visual field of each eye on an arc perimeter and recognise the pattern of field loss.',steps:[
 {t:'Set up the perimeter',short:'Prepare',d:'Position the subject and explain the test.',ok:()=>PRE.every(([k])=>V.prep[k]),body:()=>chipRow(PRE,V.prep),wire:()=>wireChips(V.prep,()=>K.refresh()),do:['Seat the subject with the chin on the rest and the tested eye at the centre of the arc.','Cover the other eye with a pad.','The subject must keep looking at the central spot and say "yes" the moment the target appears at the side.','Use a 5 mm white target.'],why:'The perimeter records the extent of the field of vision with the eye fixed. Eye movement would spoil the chart.',tips:['Check fixation by watching the subject’s eye throughout.']},
 {t:'Plot the field of each eye',short:'Plot',d:'Move the target inward along each meridian and plot where the subject first sees it.',main:()=>main(),wire,ok:()=>need('R')&&need('L'),do:['Choose the eye and a meridian. The arc rotates to that meridian.','Move the target from the periphery toward the centre in steps.','Plot the point where the subject first says "yes".','Do at least 0°, 90°, 180° and 270° for each eye. Eight meridians gives a better outline.'],why:'Joining the plotted points gives the visual field outline. The shape of any defect shows where along the visual pathway the lesion lies.',tips:['Normal limits: temporal 90°, inferior 70°, nasal 60°, superior 50°.','The blind spot lies 15° temporal to fixation.']},
 {t:'Interpret the fields',short:'Report',d:'Describe the field defect and name the likely site of the lesion.',main:()=>report(),wire:()=>{chart('R');chart('L');$$('[data-d]').forEach(b=>b.onclick=()=>{V.ans=+b.dataset.d;K.redraw()});$$('[data-q]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.q.split('-');V.q[a]=+c;K.redraw()});const s=$('#sub');if(s)s.onclick=()=>{if(V.ans==null)return;V.done=1;K.redraw()};const g=$('#again');if(g)g.onclick=()=>{newSubject();K.step=0;K.redraw()}},do:['Compare the two eyes.','Both temporal halves lost: chiasma. The same side lost in both eyes: behind the chiasma. Whole field shrunk evenly: glaucoma, retinitis pigmentosa.'],why:'Field patterns localise lesions in the visual pathway.',tips:[]}]});
newSubject();K.render();

</script>
<script>
(function(){
 var ID=document.documentElement.getAttribute('data-sim')||'';
 if(window.parent===window)return;
 document.documentElement.classList.add('emb');
 function theme(){try{var d=parent.document.documentElement.classList.contains('dark');document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}}
 theme();try{new MutationObserver(theme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 var last='';
 function post(){var h=document.documentElement.scrollHeight;parent.postMessage({qp:'height',h:h},'*');
  var s=document.querySelector('.score');if(s){var m=s.textContent.replace(/\s+/g,'').match(/^(\d+)\/(\d+)/);if(m){var k=m[1]+'/'+m[2];if(k!==last){last=k;parent.postMessage({qp:'score',tot:+m[1],max:+m[2]},'*')}}}}
 try{new MutationObserver(post).observe(document.body,{childList:true,subtree:true,attributes:true});new ResizeObserver(post).observe(document.body)}catch(e){}
 window.addEventListener('load',post);setTimeout(post,300);
})();
</script></body></html>

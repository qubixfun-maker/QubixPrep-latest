}

  --acc:#428bf0; --bd:#2b2b3b; --ok:#3fc58c; --bad:#f06a6a; --blue:#6aa2ff; --shadow:0 1px 2px #0006,0 10px 30px -14px #000;

.coach{grid-template-columns:minmax(0,1fr) auto}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.opts{display:grid;gap:8px;margin-top:10px}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
@media(max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(180deg,var(--scene),var(--scene2));border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.rtbox{min-height:220px;border-radius:16px;display:grid;place-items:center;text-align:center;padding:20px;background:var(--muted);color:var(--fg);font-size:22px;font-weight:700;border:2px dashed var(--bd);cursor:pointer;user-select:none;transition:background .05s}
.rtbox.wait{background:#fdecec;color:#a33;border-color:#e5484d} .rtbox.go{background:#3fb87f;color:#fff;border-color:#3fb87f} .rtbox.beep{background:#2f6df0;color:#fff;border-color:#2f6df0} .rtbox.bad{background:#fff1d6;color:#8a5b00;border-color:#f2c94c}
.pill:empty{display:none}
.chart{display:grid;gap:4px;justify-items:center;background:#fff;border-radius:12px;padding:12px;color:#111;transition:filter .2s}
.cl{display:flex;align-items:center;gap:14px;background:none;border:1px solid transparent;border-radius:8px;padding:0 10px;cursor:pointer;color:#111;font-family:Georgia,serif;font-weight:700;line-height:1.15}
.cl:hover{border-color:var(--bd)} .cl.on{border-color:var(--acc);background:#fff4e8}
.cl .den{font:600 11px Inter,sans-serif;color:#667;width:38px;text-align:left} .cl .lt{letter-spacing:.2em}
.say{min-height:58px;background:var(--muted);border-radius:12px;padding:12px 14px;font-size:15px}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LEADS=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'];
const LANG={I:0,II:60,III:120,aVR:-150,aVL:-30,aVF:90};
const CH={V1:{p:.06,q:0,r:.25,s:1.1,t:-.1},V2:{p:.08,q:0,r:.5,s:1.0,t:.35},V3:{p:.09,q:.02,r:.8,s:.7,t:.4},V4:{p:.1,q:.05,r:1.3,s:.35,t:.45},V5:{p:.1,q:.1,r:1.4,s:.1,t:.38},V6:{p:.09,q:.1,r:1.1,s:.05,t:.3}};
const RHY=[{k:'nsr',n:'Normal sinus rhythm',hr:[62,92],pr:.16},{k:'tachy',n:'Sinus tachycardia',hr:[108,135],pr:.14},{k:'brady',n:'Sinus bradycardia',hr:[42,54],pr:.18},{k:'af',n:'Atrial fibrillation',hr:[95,150],pr:0},{k:'avb1',n:'First-degree AV block',hr:[60,78],pr:.30}];
const AXES=[{k:'n',n:'Normal axis',a:[30,75]},{k:'lad',n:'Left axis deviation',a:[-60,-35]},{k:'rad',n:'Right axis deviation',a:[105,135]}];
let P,B;
const g=(d,c,s)=>Math.exp(-.5*((d-c)/s)**2);
function genBeats(){B=[];let t=-1.2;const rr0=60/P.hr;while(t<420){const af=P.rhythm.k==='af';const rr=af?rr0*(.5+.95*Math.random()):rr0*(1+(Math.random()-.5)*.04);t+=rr;B.push({t,rr,pr:P.rhythm.pr})}}
function newPatientData(forceNsr){const r=forceNsr?RHY[0]:pick(RHY),a=!forceNsr&&Math.random()>.6?pick(AXES.slice(1)):AXES[0];
  P={rhythm:r,axisK:a,axis:Math.round(rnd(a.a[0],a.a[1])),hr:forceNsr?75:Math.round(rnd(r.hr[0],r.hr[1]))};genBeats();return P}
function lb(t){let lo=0,hi=B.length;while(lo<hi){const m=(lo+hi)>>1;if(B[m].t<t)lo=m+1;else hi=m}return lo}
function params(l,axis){const ax=axis===undefined?P.axis:axis;if(LANG[l]===undefined)return CH[l];
  const a=LANG[l],v=Math.cos((ax-a)*Math.PI/180),d=x=>Math.cos(x*Math.PI/180);
  return{p:.15*d(60-a),q:v>.2?.07:0,r:Math.max(v,0)*1.25+.12,s:Math.max(-v,0)*1.1+.12,t:.35*d(45-a)}}
function beatVal(d,rr,pr,pm,af){let v=-pm.q*g(d,-.028,.008)+pm.r*g(d,0,.011)-pm.s*g(d,.026,.010)+pm.t*g(d,.17+.10*Math.sqrt(rr),.05);if(!af)v+=pm.p*g(d,-pr+.01,.022);return v}
function val(t,pm){let v=0,i=lb(t-.75);for(;i<B.length&&B[i].t<t+.45;i++){const b=B[i];v+=beatVal(t-b.t,b.rr,b.pr,pm,P.rhythm.k==='af')}
  v+=.03*Math.sin(6.28*.22*t);if(P.rhythm.k==='af')v+=.05*Math.sin(6.28*6*t)+.03*Math.sin(6.28*7.3*t+1);
  const n=Math.sin(Math.floor(t*400)*12.9898)*43758.5453;v+=.014*((n-Math.floor(n))-.5);return v}
function drawGrid(c,W,H,pxmm,off,bgc){
  c.fillStyle=bgc||'#fdeff1';c.fillRect(0,0,W,H);const base=W-off,a=((base%pxmm)+pxmm)%pxmm;
  for(let x=a;x<=W+1;x+=pxmm){const k=Math.round((x-base)/pxmm),M=((k%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,H);c.stroke()}
  for(let j=-Math.ceil(H/2/pxmm);j<=Math.ceil(H/2/pxmm);j++){const y=H/2+j*pxmm,M=((j%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(0,Math.round(y)+.5);c.lineTo(W,Math.round(y)+.5);c.stroke()}}
function fitCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,W:r.width,H:r.height}}

/* Shared stepper for every practical. Each simulator passes steps with: t, d, do[], why, tips[], ok(), body(), main(), wire(), msg(). */
function Kit(cfg){
  const app=$('#app');
  app.innerHTML=`<div class="wrap"><header><div><div class="eyebrow">Physiology practical · Virtual lab</div><h1>${cfg.title}</h1><p class="sub">${cfg.sub}</p></div><div class="pill" id="pt"></div></header>
  <div class="steps" id="steps"></div><div id="main"></div>
  <div class="card coach" style="margin-top:18px"><div><div class="pill" id="stepTag"></div><h2 id="cTitle" style="margin-top:8px"></h2><div class="mut" id="cText"></div><div class="msg" id="cMsg"></div><div id="cBody"></div></div>
  <div class="row"><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div></div>`;
  const K={step:0,cfg};
  const det=s=>s.do?`<div class="detail"><div><h3>What to do</h3><ol>${s.do.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>Why it matters</h3><p>${s.why||''}</p>${s.tips&&s.tips.length?`<h3>Examiner's tips</h3><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div></div>`:'';
  K.render=function(keepMain){
    const S=cfg.steps,st=S[K.step];
    $('#steps').innerHTML=S.map((s,i)=>`<div class="st ${i===K.step?'on':i<K.step?'done':''}"><b>${i<K.step?'✓':i+1}</b>${s.short||s.t}</div>`).join('');
    $('#stepTag').textContent=`Step ${K.step+1} of ${S.length}`;$('#cTitle').textContent=st.t;$('#cText').textContent=st.d||'';
    $('#cBody').innerHTML=(st.body?st.body():'')+det(st);
    if(!keepMain){$('#main').innerHTML=st.main?st.main():'';}
    const last=K.step===S.length-1;$('#back').disabled=K.step===0||(st.lockBack&&st.lockBack());$('#next').hidden=last&&!st.next;$('#next').disabled=!(st.ok?st.ok():true);
    const m=st.msg?st.msg():null,el=$('#cMsg');el.className='msg'+(m&&m[1]?' '+m[1]:'');el.textContent=m?m[0]:'';
    if(!keepMain&&st.wire)st.wire();if(st.after)st.after();
  };
  $('#next').addEventListener('click',()=>{const st=cfg.steps[K.step];if(st.ok&&!st.ok())return;if(st.leave)st.leave();K.step++;K.render()});
  $('#back').addEventListener('click',()=>{if(K.step>0){K.step--;K.render()}});
  K.refresh=()=>K.render(true);K.redraw=()=>K.render(false);
  return K;
}
Kit.score=(items,again)=>{const tot=items.reduce((a,i)=>a+i[0],0),mx=items.reduce((a,i)=>a+i[1],0);
  return `<div class="score" style="margin-top:18px">${tot}<small> / ${mx}</small></div><div class="checks">${items.map(([p,m,t])=>`<div class="ck"><span class="${p>=m?'ok':'bad'}">${p>=m?'✓':'✗'}</span><span>${t}${m>1?` (${p} of ${m})`:''}</span></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="again">New subject</button></div>`};
const chipRow=(items,state,key)=>`<div class="row" style="margin-top:12px">${items.map(([k,l])=>`<button class="chip" data-chip="${k}" aria-pressed="${!!state[k]}">${l}</button>`).join('')}</div>`;
const wireChips=(state,cb)=>$$('[data-chip]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.chip]=!state[b.dataset.chip];cb()}));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const NAMES=['Ravi K.','Sneha P.','Imran S.','Anita R.','Mahesh D.','Farah N.','Kiran B.','Lakshmi T.'];
let AC;document.addEventListener('pointerdown',()=>{if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function tone(f,dur,gain){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(gain||.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur+.02)}catch(e){}}

const PRE=[['ht','Set the step height (20 in / 51 cm for men, 16 in / 41 cm for women)'],['met','Set the metronome to 120 beats per minute (30 steps per minute)'],['rest','Take the resting pulse and note it'],['expl','Explain: step up, up, down, down in time with the beat, for 5 minutes or until exhausted']];
const TYPES=[{n:'Fit',dur:300,peak:150,tau:70,g:'Excellent'},{n:'Average',dur:300,peak:170,tau:110,g:'Good'},{n:'Unfit',dur:180,peak:185,tau:200,g:'Poor'}];
const MC=[['Harvard step test measures…',['Cardiovascular fitness','Lung compliance','Muscle power'],0],['What happens if the subject cannot continue for 5 minutes?',['Stop and record the duration in seconds','Repeat the test at once','Discard the result'],0]];
let V,tmr,sim;
function newSubject(){const T=pick(TYPES);V={prep:{},T,name:pick(NAMES),age:Math.round(rnd(18,26)),dur:null,ran:0,p:{},pfi:null,gr:null,q:{},done:0,w:null};$('#pt').textContent=`Subject: ${V.name} · ${V.age} y`}
const hr=t=>Math.round(72+(V.T.peak-72)*Math.exp(-(t-V.T.dur)/V.T.tau)),cnt=t=>Math.round(hr(V.T.dur+t-45)/2+rnd(-.8,.8));
const WIN=[[60,'1 - 1.5 min'],[120,'2 - 2.5 min'],[180,'3 - 3.5 min']];
const trueP=()=>WIN.map(([t])=>V.p[t]),PFI=()=>V.dur?100*V.dur/(2*WIN.reduce((a,[t])=>a+(V.p[t]||0),0)):0;
function stepper(){return `<svg viewBox="0 0 260 110" style="width:100%;max-width:300px;display:block;margin:0 auto"><rect x="30" y="${sim&&sim.up?52:70}" width="0" height="0"/><rect x="100" y="78" width="120" height="${V.w==='sp'?0:0}" /><rect x="110" y="70" width="110" height="30" rx="4" fill="#9aa7bd"/><text x="165" y="90" text-anchor="middle" fill="#fff" font-size="11" font-family="Inter">step 20 in</text><g transform="translate(${sim&&sim.up?150:60} ${sim&&sim.up?28:50})"><circle cx="0" cy="0" r="9" fill="#e5a97c"/><rect x="-7" y="9" width="14" height="26" rx="5" fill="#2f6df0"/><rect x="-6" y="35" width="5" height="${sim&&sim.up?18:28}" fill="#1b2338"/><rect x="2" y="35" width="5" height="28" fill="#1b2338"/></g></svg>`}
function s2(){const run=V.ran===1;return `<div class="cols"><div class="stage">${stepper()}<div class="row" style="justify-content:center;margin-top:10px"><span class="pill" id="clk">${V.ran?Math.round(V.sec||0)+' s':'0 s'}</span><span class="pill">120 beats/min</span></div><div style="height:10px;border-radius:9px;background:var(--bd);margin-top:12px"><div id="bar" style="height:100%;width:${Math.min(100,(V.sec||0)/3)}%;background:var(--acc);border-radius:9px"></div></div></div>
 <div class="panel"><div class="row"><button class="btn acc" id="go" ${V.ran?'disabled':''}>Start the test (time-lapse)</button><button class="btn" id="stop" ${run&&V.T.dur<300?'':'disabled'}>Subject cannot continue: stop</button></div><div class="say" id="st" style="margin-top:10px">${V.ran===2?`Test over. Duration: <b>${V.dur} s</b>${V.dur<300?' (subject stopped early)':' (completed 5 minutes)'}.`:run?'Subject is stepping in time with the metronome… The test runs 30× faster than real time.':'Press Start. In real life you must keep the subject in time with the metronome.'}</div><p class="mut">Seat the subject immediately when the test ends and count the pulse at the three time windows.</p></div></div>`}
function s3(){return `<div class="panel"><p class="mut">Count the pulse for 30 seconds in each window after exercise. Each button gives the 30 second count.</p><div class="scroll"><table><tr><th>Window after exercise</th><th>30 s count</th><th></th></tr>${WIN.map(([t,l])=>`<tr><td>${l}</td><td>${V.p[t]??'-'}</td><td><button class="btn" data-w="${t}" ${V.p[t]||(t>60&&!V.p[t-60])?'disabled':''}>Count pulse</button></td></tr>`).join('')}</table></div></div>`}
function s4(){const sum=WIN.reduce((a,[t])=>a+V.p[t],0);return `<div class="panel"><div class="eyebrow">Calculate</div><h2>${V.name}</h2><p>Duration <b>${V.dur} s</b> · pulse counts <b>${WIN.map(([t])=>V.p[t]).join(' + ')} = ${sum}</b></p><p class="mut">PFI = (duration in seconds × 100) ÷ (2 × sum of the three pulse counts)</p>
 <div class="two"><div><span class="lab">Your PFI</span><input type="number" id="pfi" value="${V.pfi??''}" ${V.done?'disabled':''}></div><div><span class="lab">Fitness grade</span><select id="gr" ${V.done?'disabled':''}><option value="">Select</option>${['Poor','Low average','High average','Good','Excellent'].map(g=>`<option ${V.gr===g?'selected':''}>${g}</option>`).join('')}</select></div></div>
 ${MC.map((q,i)=>`<div style="margin-top:12px"><span class="lab">${q[0]}</span><div class="row">${q[1].map((o,jx)=>`<button class="chip" data-q="${i}-${jx}" aria-pressed="${V.q[i]===jx}" ${V.done?'disabled':''}>${o}</button>`).join('')}</div></div>`).join('')}<div class="row" style="margin-top:14px"><button class="btn acc" id="sub" ${V.done?'disabled':''}>Submit to examiner</button></div>${V.done?sc():''}</div>`}
const grade=p=>p<55?'Poor':p<65?'Low average':p<80?'High average':p<90?'Good':'Excellent';
function sc(){const prep=PRE.filter(([k])=>V.prep[k]).length,tp=PFI(),d=V.dur?1:0,pc=WIN.every(([t])=>V.p[t])?1:0,pf=Math.abs(V.pfi-tp)<=Math.max(2,tp*.05)?2:0,g=V.gr===grade(tp)?1:0,q=MC.filter((x,i)=>V.q[i]===x[2]).length>=2?1:0;
 return Kit.score([[prep,4,'Preparation'],[d,1,'Duration recorded'],[pc,1,'Three pulse counts recorded'],[pf,2,'PFI calculated correctly'],[g,1,'Grade'],[q,1,'Viva questions']])+`<p class="mut" style="margin-top:12px">Correct PFI: <b>${tp.toFixed(1)}</b> (${grade(tp)}). Bands: below 55 poor, 55-64 low average, 65-79 high average, 80-89 good, 90 and above excellent.</p>`}
const K=Kit({title:'Harvard Step Test',sub:'Measure cardiovascular fitness from how quickly the pulse recovers after 5 minutes of stepping.',steps:[
 {t:'Prepare',short:'Prepare',d:'Step, metronome and resting pulse.',ok:()=>PRE.every(([k])=>V.prep[k]),body:()=>chipRow(PRE,V.prep),wire:()=>wireChips(V.prep,()=>K.refresh()),do:['Step height 20 inches (51 cm) for men and 16 inches (41 cm) for women.','Metronome at 120 beats per minute: one step cycle (up, up, down, down) every 2 seconds = 30 cycles per minute.','Record resting pulse and BP.','Show the subject how to step.'],why:'A fixed workload makes results comparable between subjects.',tips:['Stop the test if the subject has chest pain, dizziness or severe breathlessness.']},
 {t:'Perform the exercise',short:'Exercise',d:'Subject steps for 5 minutes or until exhaustion.',main:()=>s2(),wire:()=>{const upd=()=>{V.sec=sim.t;$('#clk').textContent=Math.round(sim.t)+' s';$('#bar').style.width=Math.min(100,sim.t/3)+'%';};$('#go').onclick=()=>{V.ran=1;sim={t:0,up:0};tmr=setInterval(()=>{sim.t+=3;sim.up=!sim.up;if(sim.t>=V.T.dur){V.dur=V.T.dur;V.ran=2;clearInterval(tmr);K.redraw();K.refresh();return}upd();K.redraw();$('#next').disabled=true},100)};$('#stop').onclick=()=>{V.dur=Math.round(sim.t);V.ran=2;clearInterval(tmr);K.redraw();K.refresh()}},ok:()=>V.ran===2,leave:()=>clearInterval(tmr),do:['Start the metronome and the stopwatch together.','The subject steps up and down in time for 5 minutes. Encourage the subject.','If the subject stops or cannot keep time for 15 seconds, stop and note the duration.'],why:'Exercise duration is part of the fitness formula. Failing early gives a low score.',tips:['Make the subject sit down immediately when the test ends.']},
 {t:'Count the recovery pulse',short:'Pulse',d:'Count the pulse for 30 seconds at three times after exercise.',main:()=>s3(),wire:()=>{$$('[data-w]').forEach(b=>b.onclick=()=>{const t=+b.dataset.w;V.p[t]=cnt(t);K.refresh();K.redraw()})},ok:()=>WIN.every(([t])=>V.p[t]),do:['Between 1 and 1.5 min, count the pulse for 30 seconds.','Repeat from 2 to 2.5 min and from 3 to 3.5 min.'],why:'A fit heart recovers quickly, so the pulse counts are low.',tips:['Count at the radial artery for a full 30 seconds.']},
 {t:'Calculate fitness index',short:'Report',d:'Calculate the PFI and grade the fitness.',main:()=>s4(),wire:()=>{$$('[data-q]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.q.split('-');V.q[a]=+c;V.pfi=+($('#pfi')||{}).value||V.pfi;V.gr=($('#gr')||{}).value||V.gr;K.redraw()});const s=$('#sub');if(s)s.onclick=()=>{V.pfi=+$('#pfi').value;V.gr=$('#gr').value;if(!V.pfi||!V.gr)return;V.done=1;K.redraw()};const g=$('#again');if(g)g.onclick=()=>{newSubject();K.step=0;K.redraw()}},do:['Add the three counts.','Apply the formula.'],why:'The PFI turns the test into a single number that can be graded.',tips:[]}]});
newSubject();K.render();

</script>
<script>
(function(){
 var ID=document.documentElement.getAttribute('data-sim')||'';
 if(window.parent===window)return;
 document.documentElement.classList.add('emb');
 function theme(){try{var d=parent.document.documentElement.classList.contains('dark');document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}}
 theme();try{new MutationObserver(theme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 var last='';
 function post(){var h=document.documentElement.scrollHeight;parent.postMessage({qp:'height',h:h},'*');
  var s=document.querySelector('.score');if(s){var m=s.textContent.replace(/\s+/g,'').match(/^(\d+)\/(\d+)/);if(m){var k=m[1]+'/'+m[2];if(k!==last){last=k;parent.postMessage({qp:'score',tot:+m[1],max:+m[2]},'*')}}}}
 try{new MutationObserver(post).observe(document.body,{childList:true,subtree:true,attributes:true});new ResizeObserver(post).observe(document.body)}catch(e){}
 window.addEventListener('load',post);setTimeout(post,300);
})();
</script></body></html>

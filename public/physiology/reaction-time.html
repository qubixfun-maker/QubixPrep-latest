<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LEADS=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'];
const LANG={I:0,II:60,III:120,aVR:-150,aVL:-30,aVF:90};
const CH={V1:{p:.06,q:0,r:.25,s:1.1,t:-.1},V2:{p:.08,q:0,r:.5,s:1.0,t:.35},V3:{p:.09,q:.02,r:.8,s:.7,t:.4},V4:{p:.1,q:.05,r:1.3,s:.35,t:.45},V5:{p:.1,q:.1,r:1.4,s:.1,t:.38},V6:{p:.09,q:.1,r:1.1,s:.05,t:.3}};
const RHY=[{k:'nsr',n:'Normal sinus rhythm',hr:[62,92],pr:.16},{k:'tachy',n:'Sinus tachycardia',hr:[108,135],pr:.14},{k:'brady',n:'Sinus bradycardia',hr:[42,54],pr:.18},{k:'af',n:'Atrial fibrillation',hr:[95,150],pr:0},{k:'avb1',n:'First-degree AV block',hr:[60,78],pr:.30}];
const AXES=[{k:'n',n:'Normal axis',a:[30,75]},{k:'lad',n:'Left axis deviation',a:[-60,-35]},{k:'rad',n:'Right axis deviation',a:[105,135]}];
let P,B;
const g=(d,c,s)=>Math.exp(-.5*((d-c)/s)**2);
function genBeats(){B=[];let t=-1.2;const rr0=60/P.hr;while(t<420){const af=P.rhythm.k==='af';const rr=af?rr0*(.5+.95*Math.random()):rr0*(1+(Math.random()-.5)*.04);t+=rr;B.push({t,rr,pr:P.rhythm.pr})}}
function newPatientData(forceNsr){const r=forceNsr?RHY[0]:pick(RHY),a=!forceNsr&&Math.random()>.6?pick(AXES.slice(1)):AXES[0];
  P={rhythm:r,axisK:a,axis:Math.round(rnd(a.a[0],a.a[1])),hr:forceNsr?75:Math.round(rnd(r.hr[0],r.hr[1]))};genBeats();return P}
function lb(t){let lo=0,hi=B.length;while(lo<hi){const m=(lo+hi)>>1;if(B[m].t<t)lo=m+1;else hi=m}return lo}
function params(l,axis){const ax=axis===undefined?P.axis:axis;if(LANG[l]===undefined)return CH[l];
  const a=LANG[l],v=Math.cos((ax-a)*Math.PI/180),d=x=>Math.cos(x*Math.PI/180);
  return{p:.15*d(60-a),q:v>.2?.07:0,r:Math.max(v,0)*1.25+.12,s:Math.max(-v,0)*1.1+.12,t:.35*d(45-a)}}
function beatVal(d,rr,pr,pm,af){let v=-pm.q*g(d,-.028,.008)+pm.r*g(d,0,.011)-pm.s*g(d,.026,.010)+pm.t*g(d,.17+.10*Math.sqrt(rr),.05);if(!af)v+=pm.p*g(d,-pr+.01,.022);return v}
function val(t,pm){let v=0,i=lb(t-.75);for(;i<B.length&&B[i].t<t+.45;i++){const b=B[i];v+=beatVal(t-b.t,b.rr,b.pr,pm,P.rhythm.k==='af')}
  v+=.03*Math.sin(6.28*.22*t);if(P.rhythm.k==='af')v+=.05*Math.sin(6.28*6*t)+.03*Math.sin(6.28*7.3*t+1);
  const n=Math.sin(Math.floor(t*400)*12.9898)*43758.5453;v+=.014*((n-Math.floor(n))-.5);return v}
function drawGrid(c,W,H,pxmm,off,bgc){
  c.fillStyle=bgc||'#fdeff1';c.fillRect(0,0,W,H);const base=W-off,a=((base%pxmm)+pxmm)%pxmm;
  for(let x=a;x<=W+1;x+=pxmm){const k=Math.round((x-base)/pxmm),M=((k%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,H);c.stroke()}
  for(let j=-Math.ceil(H/2/pxmm);j<=Math.ceil(H/2/pxmm);j++){const y=H/2+j*pxmm,M=((j%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(0,Math.round(y)+.5);c.lineTo(W,Math.round(y)+.5);c.stroke()}}
function fitCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,W:r.width,H:r.height}}

/* Shared stepper for every practical. Each simulator passes steps with: t, d, do[], why, tips[], ok(), body(), main(), wire(), msg(). */
function Kit(cfg){
  const app=$('#app');
  app.innerHTML=`<div class="wrap"><header><div><div class="eyebrow">Physiology practical · Virtual lab</div><h1>${cfg.title}</h1><p class="sub">${cfg.sub}</p></div><div class="pill" id="pt"></div></header>
  <div class="steps" id="steps"></div><div id="main"></div>
  <div class="card coach" style="margin-top:18px"><div><div class="pill" id="stepTag"></div><h2 id="cTitle" style="margin-top:8px"></h2><div class="mut" id="cText"></div><div class="msg" id="cMsg"></div><div id="cBody"></div></div>
  <div class="row"><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div></div>`;
  const K={step:0,cfg};
  const det=s=>s.do?`<div class="detail"><div><h3>What to do</h3><ol>${s.do.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>Why it matters</h3><p>${s.why||''}</p>${s.tips&&s.tips.length?`<h3>Examiner's tips</h3><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div></div>`:'';
  K.render=function(keepMain){
    const S=cfg.steps,st=S[K.step];
    $('#steps').innerHTML=S.map((s,i)=>`<div class="st ${i===K.step?'on':i<K.step?'done':''}"><b>${i<K.step?'✓':i+1}</b>${s.short||s.t}</div>`).join('');
    $('#stepTag').textContent=`Step ${K.step+1} of ${S.length}`;$('#cTitle').textContent=st.t;$('#cText').textContent=st.d||'';
    $('#cBody').innerHTML=(st.body?st.body():'')+det(st);
    if(!keepMain){$('#main').innerHTML=st.main?st.main():'';}
    const last=K.step===S.length-1;$('#back').disabled=K.step===0||(st.lockBack&&st.lockBack());$('#next').hidden=last&&!st.next;$('#next').disabled=!(st.ok?st.ok():true);
    const m=st.msg?st.msg():null,el=$('#cMsg');el.className='msg'+(m&&m[1]?' '+m[1]:'');el.textContent=m?m[0]:'';
    if(!keepMain&&st.wire)st.wire();if(st.after)st.after();
  };
  $('#next').addEventListener('click',()=>{const st=cfg.steps[K.step];if(st.ok&&!st.ok())return;if(st.leave)st.leave();K.step++;K.render()});
  $('#back').addEventListener('click',()=>{if(K.step>0){K.step--;K.render()}});
  K.refresh=()=>K.render(true);K.redraw=()=>K.render(false);
  return K;
}
Kit.score=(items,again)=>{const tot=items.reduce((a,i)=>a+i[0],0),mx=items.reduce((a,i)=>a+i[1],0);
  return `<div class="score" style="margin-top:18px">${tot}<small> / ${mx}</small></div><div class="checks">${items.map(([p,m,t])=>`<div class="ck"><span class="${p>=m?'ok':'bad'}">${p>=m?'✓':'✗'}</span><span>${t}${m>1?` (${p} of ${m})`:''}</span></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="again">New subject</button></div>`};
const chipRow=(items,state,key)=>`<div class="row" style="margin-top:12px">${items.map(([k,l])=>`<button class="chip" data-chip="${k}" aria-pressed="${!!state[k]}">${l}</button>`).join('')}</div>`;
const wireChips=(state,cb)=>$$('[data-chip]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.chip]=!state[b.dataset.chip];cb()}));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const NAMES=['Ravi K.','Sneha P.','Imran S.','Anita R.','Mahesh D.','Farah N.','Kiran B.','Lakshmi T.'];
let AC;document.addEventListener('pointerdown',()=>{if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function tone(f,dur,gain){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(gain||.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur+.02)}catch(e){}}

const PRE=[['consent','Explain the test and take consent'],['seat','Seat the subject comfortably, hand on the response key'],['quiet','Quiet room, no distraction'],['prac','Allow practice trials first']];
let R={prep:{},vis:[],aud:[],cho:[],early:0,ch:0,wrong:0,ans:null,mode:null,tm:null,t0:0};
const stim=(id,html,cls)=>{$(id).className='rtbox '+(cls||'');$(id).innerHTML=html};
function simple(kind,arr,need){return {main:()=>`<div class="panel"><div class="rtbox" id="rtb" tabindex="0" role="button" aria-label="Reaction area">Press Start, then wait</div><div class="row" style="margin-top:12px"><button class="btn acc" id="go">Start trial</button><span class="mut" id="rtc"></span></div><div class="kv" id="rtk"></div></div>`,
  wire:()=>{const b=$('#rtb'),draw=()=>{$('#rtc').textContent=`${arr.length} of ${need} valid trials · early clicks: ${R.early}`;$('#rtk').innerHTML=arr.length?`<div>Last<b>${Math.round(arr[arr.length-1])} ms</b></div><div>Mean<b>${Math.round(mean(arr))} ms</b></div><div>Fastest<b>${Math.round(Math.min(...arr))} ms</b></div>`:'';K.refresh()};
    const wait=()=>{if(R.mode)return;R.mode='wait';b.className='rtbox wait';b.textContent=kind==='vis'?'Wait for GREEN...':'Wait for the BEEP...';R.tm=setTimeout(()=>{R.mode='go';R.t0=performance.now();if(kind==='vis'){b.className='rtbox go';b.textContent='NOW!'}else{b.className='rtbox beep';b.textContent='Beep! Click now';tone(800,.3,.3)}},1500+Math.random()*2800)};
    $('#go').onclick=()=>{if(arr.length>=need){return}wait()};
    const hit=()=>{if(R.mode==='wait'){clearTimeout(R.tm);R.mode=null;R.early++;b.className='rtbox bad';b.textContent='Too early. Trial not counted.';draw()}else if(R.mode==='go'){const t=performance.now()-R.t0;R.mode=null;arr.push(t);b.className='rtbox';b.textContent=Math.round(t)+' ms. Press Start for the next trial.';draw()}};
    b.addEventListener('pointerdown',hit);b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();hit()}});draw()},
  ok:()=>arr.length>=need,after:()=>{}}}
const COLS=[['Red','#e5484d'],['Green','#3fb87f'],['Blue','#2f6df0'],['Yellow','#f2c94c']];
const choice={main:()=>`<div class="panel"><div class="rtbox" id="rtb">Press Start</div><div class="row" id="cbtn" style="margin-top:12px;justify-content:center">${COLS.map(([n,c],i)=>`<button class="btn" data-c="${i}" style="min-width:90px;border-color:${c};border-width:2px">${n}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn acc" id="go">Start trial</button><span class="mut" id="rtc"></span></div></div>`,
  wire:()=>{const b=$('#rtb'),draw=()=>{$('#rtc').textContent=`${R.cho.length} of 8 valid trials · wrong colour: ${R.wrong}`;K.refresh()};let cur=-1;
    $('#go').onclick=()=>{if(R.mode||R.cho.length>=8)return;R.mode='wait';b.className='rtbox wait';b.textContent='Get ready...';R.tm=setTimeout(()=>{cur=Math.floor(Math.random()*4);R.mode='go';R.t0=performance.now();b.className='rtbox';b.style.background=COLS[cur][1];b.textContent='Press the matching colour'},1200+Math.random()*2200)};
    $$('#cbtn button').forEach(x=>x.onclick=()=>{if(R.mode==='wait'){clearTimeout(R.tm);R.mode=null;R.early++;b.style.background='';b.className='rtbox bad';b.textContent='Too early.';draw();return}if(R.mode!=='go')return;const t=performance.now()-R.t0;R.mode=null;b.style.background='';if(+x.dataset.c===cur){R.cho.push(t);b.className='rtbox';b.textContent=Math.round(t)+' ms'}else{R.wrong++;b.className='rtbox bad';b.textContent='Wrong colour. Trial not counted.'}draw()});draw()},
  ok:()=>R.cho.length>=8};
const QA=[['Which was usually the fastest?','Auditory (simple)',['Auditory (simple)','Visual (simple)','Choice reaction','All equal'],'Sound reaches the brain faster than light is processed: the cochlear pathway has fewer synapses and quicker transduction than the retina.'],['Why is choice reaction time longer?','The brain must discriminate and select a response',['The brain must discriminate and select a response','The muscles are slower','The receptors are different','Nerve conduction is slower'],'Extra central processing (discrimination and decision) adds delay. Reaction time rises with the number of choices (Hick\'s law).']];
function rep(){const v=R.vis,a=R.aud,c=R.cho,m=x=>Math.round(mean(x)),s=x=>Math.round(sd(x));
  return `<div class="panel"><div class="eyebrow">Your results</div><h2>Reaction times</h2><div class="scroll"><table><tr><th>Test</th><th>Your mean</th><th>SD</th><th>Normal (young adult)</th></tr><tr><td>Simple visual</td><td><b>${m(v)} ms</b></td><td>${s(v)}</td><td>180 to 250 ms</td></tr><tr><td>Simple auditory</td><td><b>${m(a)} ms</b></td><td>${s(a)}</td><td>140 to 200 ms</td></tr><tr><td>Choice (4 colours)</td><td><b>${m(c)} ms</b></td><td>${s(c)}</td><td>350 to 500 ms</td></tr></table></div>
  <p class="mut">Early clicks: ${R.early}. Wrong colours: ${R.wrong}.</p>${QA.map((q,i)=>`<div style="margin-top:12px"><span class="lab">${q[0]}</span><select id="q${i}" ${R.ans?'disabled':''}><option value="">Select</option>${q[2].map(o=>`<option ${R.ans&&R.ans[i]===o?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}
  <div class="row" style="margin-top:12px"><button class="btn acc" id="sub" ${R.ans?'disabled':''}>Submit to examiner</button></div><div id="sc">${R.ans?score():''}</div></div>`}
function score(){const prep=PRE.filter(([k])=>R.prep[k]).length,fast=mean(R.aud)<mean(R.vis)?1:0,qs=QA.map((q,i)=>R.ans[i]===q[1]?1:0),clean=R.early<=2?1:0;
  return Kit.score([[prep,4,'Preparation'],[clean,1,'Few early clicks (no anticipation)'],[qs[0],1,'Fastest test identified'],[qs[1],1,'Reason choice reaction is slower'],[fast,1,'Your auditory time was shorter than visual (matches physiology)']])+`<p class="mut" style="margin-top:12px">${QA.map((q,i)=>q[3]).join(' ')}</p>`}
const K=Kit({title:'Reaction Time',sub:'Measure your own simple visual, simple auditory and choice reaction times, then compare with normal values.',steps:[
 {t:'Prepare the subject',short:'Prepare',d:'Get the subject ready. For this practical you can be the subject.',ok:()=>PRE.every(([k])=>R.prep[k]),body:()=>chipRow(PRE,R.prep),wire:()=>wireChips(R.prep,()=>K.refresh()),
  do:['Explain that you will measure how fast they respond to a signal. Take consent.','Seat the subject comfortably with the hand on the response key.','Remove distractions: quiet room, no talking.','Allow a few practice trials so the subject understands the signal.'],
  why:'Reaction time is the delay between a stimulus and the start of a response. It depends on the receptor, afferent conduction, central processing and synaptic delay, efferent conduction and the muscle. Anticipation and distraction spoil the result.',tips:['Never give a warning before the signal: the delay must be random.','Take the mean of at least 5 trials, not the best one.']},
 Object.assign({t:'Simple visual reaction time',short:'Visual',d:'Click as soon as the box turns green. You need 5 valid trials.',
  do:['Press Start trial and wait with your hand ready.','Click as soon as the box turns green. Do not click early.','Repeat until 5 valid trials are recorded.'],why:'Light is converted to nerve impulses in the retina, travels through the optic pathway to the visual cortex, then to the motor cortex and the hand muscles. Simple visual reaction time is about 200 ms.',tips:['An early click is not counted. Do not guess the timing.']},simple('vis',R.vis,5)),
 Object.assign({t:'Simple auditory reaction time',short:'Auditory',d:'Click as soon as you hear the beep. Turn the sound on. 5 valid trials.',
  do:['Make sure the volume is on.','Press Start trial and wait for the beep.','Click as soon as you hear it. 5 valid trials.'],why:'The auditory pathway has fewer synapses and a faster transduction (hair cells) than the retina, so auditory reaction time is shorter, about 150 ms.',tips:['Compare your own auditory and visual means at the end.']},simple('aud',R.aud,5)),
 Object.assign({t:'Choice reaction time',short:'Choice',d:'A colour appears. Click the button of the same colour. 8 valid trials.',
  do:['Press Start trial.','When a colour appears, click the button with the same colour name as fast as you can.','Wrong colours are not counted.'],why:'Now the brain must recognise the stimulus and choose between four responses. This adds central processing time, so choice reaction time is about twice the simple reaction time.',tips:['The more choices there are, the longer the delay (Hick\'s law).']},choice),
 {t:'Report and compare',short:'Report',d:'Compare your values with the normal range and answer two questions.',main:()=>rep(),wire:()=>{const s=$('#sub');if(s)s.onclick=()=>{const a=QA.map((q,i)=>$('#q'+i).value);if(a.some(x=>!x))return;R.ans=a;K.redraw()};const g=$('#again');if(g)g.onclick=()=>{R={prep:{},vis:[],aud:[],cho:[],early:0,wrong:0,ans:null,mode:null};K.step=0;K.redraw()}},
  do:['Compare your visual, auditory and choice means.','Work out why the three differ.'],why:'Reaction time is used to study the speed of central processing and is affected by age, fatigue, alcohol, drugs and attention.',tips:[]}]});
K.render();

</script>
<script>
(function(){
 var ID=document.documentElement.getAttribute('data-sim')||'';
 if(window.parent===window)return;
 document.documentElement.classList.add('emb');
 function theme(){try{var d=parent.document.documentElement.classList.contains('dark');document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}}
 theme();try{new MutationObserver(theme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 var last='';
 function post(){var h=document.documentElement.scrollHeight;parent.postMessage({qp:'height',h:h},'*');
  var s=document.querySelector('.score');if(s){var m=s.textContent.replace(/\s+/g,'').match(/^(\d+)\/(\d+)/);if(m){var k=m[1]+'/'+m[2];if(k!==last){last=k;parent.postMessage({qp:'score',tot:+m[1],max:+m[2]},'*')}}}}
 try{new MutationObserver(post).observe(document.body,{childList:true,subtree:true,attributes:true});new ResizeObserver(post).observe(document.body)}catch(e){}
 window.addEventListener('load',post);setTimeout(post,300);
})();
</script></body></html>

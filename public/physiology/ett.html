<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LEADS=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'];
const LANG={I:0,II:60,III:120,aVR:-150,aVL:-30,aVF:90};
const CH={V1:{p:.06,q:0,r:.25,s:1.1,t:-.1},V2:{p:.08,q:0,r:.5,s:1.0,t:.35},V3:{p:.09,q:.02,r:.8,s:.7,t:.4},V4:{p:.1,q:.05,r:1.3,s:.35,t:.45},V5:{p:.1,q:.1,r:1.4,s:.1,t:.38},V6:{p:.09,q:.1,r:1.1,s:.05,t:.3}};
const RHY=[{k:'nsr',n:'Normal sinus rhythm',hr:[62,92],pr:.16},{k:'tachy',n:'Sinus tachycardia',hr:[108,135],pr:.14},{k:'brady',n:'Sinus bradycardia',hr:[42,54],pr:.18},{k:'af',n:'Atrial fibrillation',hr:[95,150],pr:0},{k:'avb1',n:'First-degree AV block',hr:[60,78],pr:.30}];
const AXES=[{k:'n',n:'Normal axis',a:[30,75]},{k:'lad',n:'Left axis deviation',a:[-60,-35]},{k:'rad',n:'Right axis deviation',a:[105,135]}];
let P,B;
const g=(d,c,s)=>Math.exp(-.5*((d-c)/s)**2);
function genBeats(){B=[];let t=-1.2;const rr0=60/P.hr;while(t<420){const af=P.rhythm.k==='af';const rr=af?rr0*(.5+.95*Math.random()):rr0*(1+(Math.random()-.5)*.04);t+=rr;B.push({t,rr,pr:P.rhythm.pr})}}
function newPatientData(forceNsr){const r=forceNsr?RHY[0]:pick(RHY),a=!forceNsr&&Math.random()>.6?pick(AXES.slice(1)):AXES[0];
  P={rhythm:r,axisK:a,axis:Math.round(rnd(a.a[0],a.a[1])),hr:forceNsr?75:Math.round(rnd(r.hr[0],r.hr[1]))};genBeats();return P}
function lb(t){let lo=0,hi=B.length;while(lo<hi){const m=(lo+hi)>>1;if(B[m].t<t)lo=m+1;else hi=m}return lo}
function params(l,axis){const ax=axis===undefined?P.axis:axis;if(LANG[l]===undefined)return CH[l];
  const a=LANG[l],v=Math.cos((ax-a)*Math.PI/180),d=x=>Math.cos(x*Math.PI/180);
  return{p:.15*d(60-a),q:v>.2?.07:0,r:Math.max(v,0)*1.25+.12,s:Math.max(-v,0)*1.1+.12,t:.35*d(45-a)}}
function beatVal(d,rr,pr,pm,af){let v=-pm.q*g(d,-.028,.008)+pm.r*g(d,0,.011)-pm.s*g(d,.026,.010)+pm.t*g(d,.17+.10*Math.sqrt(rr),.05);if(!af)v+=pm.p*g(d,-pr+.01,.022);return v}
function val(t,pm){let v=0,i=lb(t-.75);for(;i<B.length&&B[i].t<t+.45;i++){const b=B[i];v+=beatVal(t-b.t,b.rr,b.pr,pm,P.rhythm.k==='af')}
  v+=.03*Math.sin(6.28*.22*t);if(P.rhythm.k==='af')v+=.05*Math.sin(6.28*6*t)+.03*Math.sin(6.28*7.3*t+1);
  const n=Math.sin(Math.floor(t*400)*12.9898)*43758.5453;v+=.014*((n-Math.floor(n))-.5);return v}
function drawGrid(c,W,H,pxmm,off,bgc){
  c.fillStyle=bgc||'#fdeff1';c.fillRect(0,0,W,H);const base=W-off,a=((base%pxmm)+pxmm)%pxmm;
  for(let x=a;x<=W+1;x+=pxmm){const k=Math.round((x-base)/pxmm),M=((k%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,H);c.stroke()}
  for(let j=-Math.ceil(H/2/pxmm);j<=Math.ceil(H/2/pxmm);j++){const y=H/2+j*pxmm,M=((j%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(0,Math.round(y)+.5);c.lineTo(W,Math.round(y)+.5);c.stroke()}}
function fitCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,W:r.width,H:r.height}}


const STG=[[1.7,10,4.6],[2.5,12,7],[3.4,14,10],[4.2,16,12.9],[5.0,18,15],[5.5,20,17]];
const NAMES=['Ravi K.','Sneha P.','Imran S.','Anita R.','Mahesh D.','Farah N.','Kiran B.','Lakshmi T.'];
const CONTRA=['Acute myocardial infarction within 2 days','Unstable angina','Uncontrolled arrhythmia with symptoms','Symptomatic severe aortic stenosis','Acute pulmonary embolism','Decompensated heart failure','Acute aortic dissection'];
let E;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function newSubject(){
  const r=Math.random(),type=r<.33?'normal':r<.63?'isch':r<.83?'hypo':'contra';
  const age=Math.round(rnd(38,64)),sex=pick(['M','F']),rest={hr:Math.round(rnd(66,80)),sys:Math.round(rnd(118,138)),dia:Math.round(rnd(74,86))};
  const hist={normal:['Atypical chest discomfort, not related to exertion','No known heart disease','Non-smoker, no diabetes'],isch:['Chest tightness on climbing stairs for 2 months','Smoker for 20 years','Father had a heart attack at 52'],hypo:['Breathlessness on exertion for 3 months','Hypertension on treatment','Feels dizzy on rapid walking'],contra:['Admitted yesterday with a heart attack (acute MI)','Now pain free and stable','Troponin raised, on treatment']}[type];
  E={step:0,type,age,sex,rest,hist,name:pick(NAMES),mphr:220-age,prep:{},screen:null,restEcg:false,restBP:false,tgt:'',run:{on:false,simT:0,over:false,stopT:null,reason:'',bp:[],log:[],mult:18,sym:false},rec:{on:false,t:0,bp:false},ans:null,done:false};
  E.thr=Math.round(.85*E.mphr);
  const shown=type==='contra'?['Age','Sex','History']:['Age','Sex'];
  $('#pt').textContent=`Patient: ${E.name} · ${age} y · ${sex}`;
  P={rhythm:RHY[0],axis:60,hr:rest.hr};B=[];ecgT=0;nextBeat=-.5;
  render();
}
/* physiology model, simT in simulated seconds */
function phys(t){
  const s=E,r=E.rest,type=E.type;let hr,sys,dia,st=0,sym=null;
  if(type==='normal'){const f=clamp(t/900,0,1);hr=r.hr+(.93*s.mphr-r.hr)*f;sys=r.sys+55*f;dia=r.dia+3*f}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LEADS=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'];
const LANG={I:0,II:60,III:120,aVR:-150,aVL:-30,aVF:90};
const CH={V1:{p:.06,q:0,r:.25,s:1.1,t:-.1},V2:{p:.08,q:0,r:.5,s:1.0,t:.35},V3:{p:.09,q:.02,r:.8,s:.7,t:.4},V4:{p:.1,q:.05,r:1.3,s:.35,t:.45},V5:{p:.1,q:.1,r:1.4,s:.1,t:.38},V6:{p:.09,q:.1,r:1.1,s:.05,t:.3}};
const RHY=[{k:'nsr',n:'Normal sinus rhythm',hr:[62,92],pr:.16},{k:'tachy',n:'Sinus tachycardia',hr:[108,135],pr:.14},{k:'brady',n:'Sinus bradycardia',hr:[42,54],pr:.18},{k:'af',n:'Atrial fibrillation',hr:[95,150],pr:0},{k:'avb1',n:'First-degree AV block',hr:[60,78],pr:.30}];
const AXES=[{k:'n',n:'Normal axis',a:[30,75]},{k:'lad',n:'Left axis deviation',a:[-60,-35]},{k:'rad',n:'Right axis deviation',a:[105,135]}];
let P,B;
const g=(d,c,s)=>Math.exp(-.5*((d-c)/s)**2);
function genBeats(){B=[];let t=-1.2;const rr0=60/P.hr;while(t<420){const af=P.rhythm.k==='af';const rr=af?rr0*(.5+.95*Math.random()):rr0*(1+(Math.random()-.5)*.04);t+=rr;B.push({t,rr,pr:P.rhythm.pr})}}
function newPatientData(forceNsr){const r=forceNsr?RHY[0]:pick(RHY),a=!forceNsr&&Math.random()>.6?pick(AXES.slice(1)):AXES[0];
  P={rhythm:r,axisK:a,axis:Math.round(rnd(a.a[0],a.a[1])),hr:forceNsr?75:Math.round(rnd(r.hr[0],r.hr[1]))};genBeats();return P}
function lb(t){let lo=0,hi=B.length;while(lo<hi){const m=(lo+hi)>>1;if(B[m].t<t)lo=m+1;else hi=m}return lo}
function params(l,axis){const ax=axis===undefined?P.axis:axis;if(LANG[l]===undefined)return CH[l];
  const a=LANG[l],v=Math.cos((ax-a)*Math.PI/180),d=x=>Math.cos(x*Math.PI/180);
  return{p:.15*d(60-a),q:v>.2?.07:0,r:Math.max(v,0)*1.25+.12,s:Math.max(-v,0)*1.1+.12,t:.35*d(45-a)}}
function beatVal(d,rr,pr,pm,af){let v=-pm.q*g(d,-.028,.008)+pm.r*g(d,0,.011)-pm.s*g(d,.026,.010)+pm.t*g(d,.17+.10*Math.sqrt(rr),.05);if(!af)v+=pm.p*g(d,-pr+.01,.022);return v}

  const n=Math.sin(Math.floor(t*400)*12.9898)*43758.5453;v+=.014*((n-Math.floor(n))-.5);return v}
function drawGrid(c,W,H,pxmm,off,bgc){

  for(let j=-Math.ceil(H/2/pxmm);j<=Math.ceil(H/2/pxmm);j++){const y=H/2+j*pxmm,M=((j%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(0,Math.round(y)+.5);c.lineTo(W,Math.round(y)+.5);c.stroke()}}

const NAMES=['Ravi K.','Sneha P.','Imran S.','Anita R.','Mahesh D.','Farah N.','Kiran B.','Lakshmi T.'];
const KEYS=[['lying','Lying'],['sitting','Sitting'],['stand1','Standing 1 min'],['stand3','Standing 3 min']];
const PREPS=[['consent','Explain the procedure and take consent'],['arm','Bare the arm, support it at heart level'],['cuff','Wrap the cuff snugly, 2.5 cm above the elbow crease, bladder over the brachial artery'],['zero','Check that the mercury column rests at zero']];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let D,AC=null;
const DELTA={normal:{lying:[0,0,0],sitting:[2,2,4],stand1:[-3,6,12],stand3:[-2,7,10]},ortho:{lying:[0,0,0],sitting:[-4,-2,6],stand1:[-26,-12,20],stand3:[-32,-14,24]},tachy:{lying:[0,0,0],sitting:[0,2,8],stand1:[-2,6,38],stand3:[0,7,40]}};
function newSubject(){
  const r=Math.random(),type=r<.4?'normal':r<.7?'ortho':'tachy',age=Math.round(rnd(20,70));
  D={step:0,type,age,name:pick(NAMES),sex:pick(['M','F']),base:{sys:Math.round(rnd(112,130)),dia:Math.round(rnd(70,82)),hr:Math.round(rnd(66,80))},prep:{},pos:'lying',tmin:0,rested:false,truth:{},R:{},cuff:{P:0,valve:false,pump:false,sys:null,dia:null,steth:false,beat:0,events:0},sound:true,palp:null,ans:null};
  $('#pt').textContent=`Subject: ${D.name} · ${age} y · ${D.sex}`;$('#rep').hidden=true;render();
}
const keyNow=()=>D.pos==='lying'?'lying':D.pos==='sitting'?'sitting':D.tmin>=3?'stand3':D.tmin>=1?'stand1':null;
function truth(k){if(!D.truth[k]){const d=DELTA[D.type][k],n=()=>Math.round(rnd(-2,2));D.truth[k]={sys:D.base.sys+d[0]+n(),dia:D.base.dia+d[1]+n(),hr:D.base.hr+d[2]+n()}}return D.truth[k]}
/* scene */
function pose(){
  const p=D.pos,k=keyNow(),sym=D.pos==='standing'&&D.tmin>=1&&D.type!=='normal',skin='var(--skin)',skin2='var(--skin2)',cl='#3d5ba8',sh='#e67123';
  let g='';const heartY={lying:195,sitting:128,standing:118}[p];

  let arm='';

    <g stroke-linecap="round"><path d="M150 196 L268 196" stroke="${sh}" stroke-width="30"/><path d="M268 196 L388 198" stroke="${cl}" stroke-width="22"/><circle cx="112" cy="188" r="16" style="fill:${skin};stroke:${skin2}"/></g>`;
    arm={x1:158,y1:206,x2:222,y2:218,x3:290,y3:216}}
  if(p==='sitting'){g+=`<rect x="196" y="206" width="80" height="12" rx="5" fill="#5b7fd0"/><rect x="226" y="216" width="10" height="46" fill="#3c465a"/><rect x="316" y="148" width="110" height="10" rx="4" fill="#8c6b47"/><rect x="340" y="156" width="8" height="106" fill="#6e5236"/>
    <g stroke-linecap="round"><path d="M236 200 L236 118" stroke="${sh}" stroke-width="32"/><path d="M236 200 L302 200 L302 258" stroke="${cl}" stroke-width="22" fill="none"/><circle cx="238" cy="92" r="17" style="fill:${sym?'#e8b0a0':skin};stroke:${skin2}"/></g>`;
    arm={x1:240,y1:130,x2:274,y2:154,x3:332,y3:150}}
  if(p==='standing'){g+=`<g stroke-linecap="round"><path d="M232 170 L222 262" stroke="${cl}" stroke-width="22"/><path d="M236 170 L246 262" stroke="#2f4a8f" stroke-width="22"/><path d="M236 172 L236 100" stroke="${sh}" stroke-width="32"/><circle cx="238" cy="74" r="17" style="fill:${sym?'#e8b0a0':skin};stroke:${skin2}"/></g><path d="M330 142 L330 262" stroke="#98a3b8" stroke-width="5"/><rect x="316" y="140" width="48" height="8" rx="4" fill="#8c6b47"/>`;
    arm={x1:240,y1:112,x2:282,y2:126,x3:332,y3:130}}
  g+=`<g stroke-linecap="round" fill="none"><path d="M${arm.x1} ${arm.y1} L${arm.x2} ${arm.y2}" stroke="${skin}" stroke-width="12"/><path d="M${arm.x2} ${arm.y2} L${arm.x3} ${arm.y3}" stroke="${skin2}" stroke-width="10"/></g>`;
  const mx=(arm.x1+arm.x2)/2,my=(arm.y1+arm.y2)/2,ang=Math.atan2(arm.y2-arm.y1,arm.x2-arm.x1)*57.3,inf=D.cuff.P>20;

  if(D.cuff.steth)g+=`<g transform="translate(${arm.x2-14} ${arm.y2-4})"><circle r="7" fill="#2b3340"/><circle r="3.5" fill="#98a3b8"/></g>`;
  g+=`<line x1="40" y1="${heartY}" x2="430" y2="${heartY}" stroke="var(--acc)" stroke-width="1.4" stroke-dasharray="6 6" opacity=".8"/><text x="436" y="${heartY-4}" text-anchor="end" font-size="11" font-weight="700" font-family="Inter,sans-serif" fill="var(--acc)">heart level</text>`;
  if(sym)g+=`<g><rect x="262" y="26" width="170" height="32" rx="12" style="fill:var(--card);stroke:var(--bd)"/><text x="347" y="47" text-anchor="middle" font-size="12" font-weight="600" font-family="Inter,sans-serif" style="fill:var(--bad)">${D.type==='ortho'?'I feel light-headed':'My heart is racing'}</text></g>`;

/* manometer */
function mano(){let h=`<rect x="44" y="8" width="52" height="300" rx="18" fill="#e8eef9" stroke="#8b97b1" stroke-width="2" opacity=".9"/><rect x="62" y="14" width="16" height="288" rx="8" fill="#cfd8ea"/>`;
  for(let v=0;v<=300;v+=10){const y=302-v*.96,big=v%50===0;h+=`<line x1="${big?96:100}" y1="${y}" x2="106" y2="${y}" stroke="#4a5670" stroke-width="${big?1.6:1}"/>${big?`<text x="112" y="${y+4}" font-size="11" font-weight="700" font-family="Inter,sans-serif" fill="#4a5670">${v}</text>`:''}`}
  h+=`<rect id="hg" x="62" y="302" width="16" height="0" rx="2" fill="#6b7280"/><rect x="62" y="302" width="16" height="0" id="hgv" fill="#c3c9d6"/><text x="75" y="326" text-anchor="middle" font-size="11" font-weight="700" font-family="Inter,sans-serif" fill="#4a5670">mmHg</text>`;
  $('#mano').innerHTML=h}
function drawMano(){const P=clamp(D.cuff.P,0,300),hgt=P*.96;const e=document.getElementById('hg');if(e){e.setAttribute('y',302-hgt);e.setAttribute('height',hgt)}}
/* steps */
const STEPS=[
 {tag:'Step 1 of 5',t:'Prepare the subject and the apparatus',d:'Tick each action as you do it.',ok:()=>PREPS.every(([k])=>D.prep[k]),
  do:['Explain that the cuff will squeeze the arm for about a minute. Take consent.','Remove tight sleeves. Support the bare arm so that the cuff is at the level of the heart (the dashed line).','Wrap the cuff 2.5 cm above the elbow crease with the bladder over the brachial artery, snug enough to admit two fingers.','Check that the mercury meniscus is at zero when the cuff is empty.'],
  why:'Blood pressure is the pressure at the level of the heart. An arm below the heart reads too high, and an arm above reads too low, by about 0.8 mmHg for every centimetre. A loose cuff reads falsely high.',tips:['Cuff bladder should cover 80 percent of the arm circumference.','The subject should not talk, cross the legs or have had tea, coffee or a cigarette in the last 30 minutes.']},
 {tag:'Step 2 of 5',t:'Lying down: baseline',d:'Let the subject rest lying down, then measure BP and pulse.',ok:()=>!!D.R.lying&&D.R.lying.pulse!=null,
  do:['Let the subject lie flat and rest for 5 minutes (use the button).','Count the radial pulse for 30 seconds and double it.','Inflate the cuff to about 160 mmHg, put the stethoscope over the brachial artery, then release the valve at 2 to 3 mmHg per second.','Press Mark SYSTOLIC at the first tapping sound and Mark DIASTOLIC when the sounds disappear. Then save.'],
  why:'Rest removes the effect of activity and anxiety, so you get a true baseline. The Korotkoff sounds are made by turbulent blood spurting through the partly compressed artery: first sound = systolic, disappearance = diastolic (phase V).',tips:['Deflating too fast makes you under-read systolic and over-read diastolic.','Wait 1 to 2 minutes before re-measuring on the same arm.']},
 {tag:'Step 3 of 5',t:'Sitting up',d:'Raise the subject to a sitting position with the arm still at heart level, and measure again.',ok:()=>!!D.R.sitting&&D.R.sitting.pulse!=null,
  do:['Press Sit the subject up. The arm must again be at heart level (rest it on the table).','Wait 2 minutes, then measure the pulse and BP as before.'],
  why:'Sitting moves about 300 to 500 mL of blood to the veins of the legs. Venous return and cardiac output fall slightly, and the baroreceptor reflex compensates.',tips:['Support the arm on the table, or the reading will change for the wrong reason.']},
 {tag:'Step 4 of 5',t:'Standing',d:'Ask the subject to stand. Measure at 1 minute and at 3 minutes. Ask how they feel.',ok:()=>!!D.R.stand1&&D.R.stand1.pulse!=null&&!!D.R.stand3&&D.R.stand3.pulse!=null,
  do:['Press Ask the subject to stand. Hold the arm at heart level.','Press Wait 1 min, then measure the pulse and BP.','Press Wait 2 more min (3 minutes standing in total), and measure again.','Watch the subject for pallor and dizziness. Be ready to help them sit down.'],
  why:'On standing, about 500 mL of blood pools in the legs. Venous return and stroke volume fall, so BP tends to fall. The baroreceptors in the carotid sinus and aortic arch sense this at once. They raise sympathetic outflow, which increases heart rate and constricts vessels, so BP is quickly restored.',tips:['Orthostatic hypotension: fall in systolic BP of 20 mmHg or more, or diastolic of 10 mmHg or more, within 3 minutes of standing.','A normal response is a small fall in systolic BP, a small rise in diastolic BP and a rise in pulse of 10 to 20 per minute.']},
 {tag:'Step 5 of 5',t:'Report and interpret',d:'Look at the changes between lying and standing and decide what the subject has.',ok:()=>false,do:['Compare lying with standing at 1 and 3 minutes.','Work out the fall in systolic and diastolic pressure and the rise in pulse.','Decide whether the response is normal.'],why:'The change in BP and heart rate tells you how well the baroreceptor reflex and the circulation compensate for gravity.',tips:[]}];
function detail(s){return `<div class="detail"><div><h3>What to do</h3><ol>${s.do.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>Why it matters</h3><p>${s.why}</p>${s.tips.length?`<h3>Examiner's tips</h3><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div></div>`}
function render(){
  const st=STEPS[D.step];$('#steps').innerHTML=STEPS.map((s,i)=>`<div class="st ${i===D.step?'on':i<D.step?'done':''}"><b>${i<D.step?'✓':i+1}</b>${s.t.split(':')[0]}</div>`).join('');
  $('#stepTag').textContent=st.tag;$('#cTitle').textContent=st.t;$('#cText').textContent=st.d;
  const rep=D.step===4;$('#bench').hidden=rep;$('#rep').hidden=!rep;
  let body='';if(D.step===0)body=`<div class="opts" style="margin-top:12px">${PREPS.map(([k,l])=>`<label><input type="checkbox" data-p="${k}" ${D.prep[k]?'checked':''}> ${l}</label>`).join('')}</div>`;
  $('#cBody').innerHTML=body+detail(st);$$('[data-p]').forEach(c=>c.addEventListener('change',()=>{D.prep[c.dataset.p]=c.checked;render()}));
  if(rep){$('#rep').innerHTML=report();wireReport()}
  $('#back').disabled=D.step===0;$('#next').hidden=rep;$('#next').disabled=!st.ok();
  const pos=D.pos,k=keyNow();$('#posTag').textContent={lying:'Lying',sitting:'Sitting',standing:'Standing'}[pos];
  $('#clock').innerHTML=`<div>Position<b>${{lying:'Lying',sitting:'Sitting',standing:'Standing'}[pos]}</b></div><div>Time in position<b>${pos==='lying'?(D.rested?'5+ min':'just lay down'):pos==='standing'?D.tmin+' min':'2 min'}</b></div><div>Cuff pressure<b id="cp">${Math.round(D.cuff.P)}</b></div>`;
  actions();table();pose();$('#steth').setAttribute('aria-pressed',D.cuff.steth);$('#snd').setAttribute('aria-pressed',D.sound);
  const sv=k&&D.R[k]&&D.R[k].sys!=null;$('#save').disabled=!(D.cuff.sys!=null&&D.cuff.dia!=null);
}
function actions(){const a=$('#actions'),s=D.step;let h='';
  if(s===1)h=`<button class="btn ${D.rested?'on':''}" id="aRest">${D.rested?'Rested 5 min ✓':'Let the subject rest 5 min'}</button>`;
  if(s===2)h=D.pos!=='sitting'?`<button class="btn acc" id="aSit">Sit the subject up</button>`:`<span class="mut" style="font-size:13px">Subject is sitting (2 min). Measure now.</span>`;
  if(s===3){if(D.pos!=='standing')h=`<button class="btn acc" id="aStand">Ask the subject to stand</button>`;else h=`<button class="btn" id="aW1" ${D.tmin>=1?'disabled':''}>Wait 1 min</button><button class="btn" id="aW3" ${D.tmin>=3||D.tmin<1?'disabled':''}>Wait 2 more min</button><button class="btn" id="aLie">Help the subject sit down</button>`}
  a.innerHTML=h;
  const b=id=>document.getElementById(id);
  if(b('aRest'))b('aRest').onclick=()=>{D.rested=true;msg('Subject rested for 5 minutes.');render()};
  if(b('aSit'))b('aSit').onclick=()=>{D.pos='sitting';D.cuff.P=0;D.cuff.sys=D.cuff.dia=null;render()};
  if(b('aStand'))b('aStand').onclick=()=>{D.pos='standing';D.tmin=0;D.cuff.P=0;D.cuff.sys=D.cuff.dia=null;render()};
  if(b('aW1'))b('aW1').onclick=()=>{D.tmin=1;render()};if(b('aW3'))b('aW3').onclick=()=>{D.tmin=3;render()};
  if(b('aLie'))b('aLie').onclick=()=>{D.pos='sitting';render()};
}
function table(){$('#tbl').innerHTML=`<tr><th>Position</th><th>BP</th><th>Pulse</th></tr>`+KEYS.map(([k,l])=>{const r=D.R[k]||{};return `<tr><td>${l}</td><td>${r.sys!=null?r.sys+'/'+r.dia:'-'}</td><td>${r.pulse!=null?r.pulse:'-'}</td></tr>`}).join('')}
function msg(t,bad){const m=$('#mMsg');m.textContent=t;m.style.color=bad?'var(--bad)':'var(--mfg)'}
/* controls */
let ac;function click(){if(!ac)try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
document.addEventListener('pointerdown',click,{once:true});
function thump(){if(!D.sound||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=90;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.35,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.09);o.start();o.stop(ac.currentTime+.1)}catch(e){}}
$('#steth').addEventListener('click',()=>{D.cuff.steth=!D.cuff.steth;render()});
$('#snd').addEventListener('click',()=>{D.sound=!D.sound;render()});
$('#rate').addEventListener('input',e=>{$('#rateV').textContent=e.target.value});
const hold=(el,key)=>{const on=()=>{D.cuff[key]=true};const off=()=>{D.cuff[key]=false};el.addEventListener('pointerdown',e=>{try{el.setPointerCapture(e.pointerId)}catch(_){}on()});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,off));el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();on()}});el.addEventListener('keyup',off)};
hold($('#pump'),'pump');hold($('#valve'),'valve');
function canMeasure(){if(!D.prep.cuff||!D.prep.arm){msg('Prepare the arm and the cuff first (step 1).',1);return false}
  if(D.step<1||D.step>3){msg('Measure in steps 2 to 4.',1);return false}
  if(D.step===1&&!D.rested){msg('Let the subject rest for 5 minutes first.',1);return false}
  const k=keyNow();if(!k){msg('Wait 1 minute after standing, then measure.',1);return false}
  if((D.step===1&&k!=='lying')||(D.step===2&&k!=='sitting')||(D.step===3&&!/stand/.test(k))){msg('Position does not match this step.',1);return false}return true}
$('#mSys').addEventListener('click',()=>{if(D.cuff.P<=0||!canMeasure())return;D.cuff.sys=Math.round(D.cuff.P);msg(`Systolic marked at ${D.cuff.sys} mmHg. Keep deflating until the sounds vanish.`);render()});
$('#mDia').addEventListener('click',()=>{if(D.cuff.sys==null){msg('Mark the systolic pressure first.',1);return}if(D.cuff.P<=0)return;D.cuff.dia=Math.round(D.cuff.P);msg(`Diastolic marked at ${D.cuff.dia} mmHg. Save the reading.`);render()});
$('#save').addEventListener('click',()=>{if(!canMeasure())return;const k=keyNow();if(D.cuff.dia>=D.cuff.sys){msg('Diastolic must be lower than systolic. Try again.',1);D.cuff.sys=D.cuff.dia=null;render();return}
  D.R[k]=Object.assign(D.R[k]||{},{sys:D.cuff.sys,dia:D.cuff.dia});D.cuff.sys=D.cuff.dia=null;D.cuff.P=0;msg('Reading saved.');render()});
$('#palp').addEventListener('click',()=>{if(!canMeasure())return;if(D.palp)return;D.palp=performance.now();msg('Counting the radial pulse for 30 seconds (sped up). Watch the beats.');$('#palp').disabled=true;setTimeout(()=>{D.palp=null;$('#palp').disabled=false;msg('Time up. Enter how many beats you counted.')},5000)});
$('#psave').addEventListener('click',()=>{if(!canMeasure())return;const v=+$('#pcount').value;if(!v){msg('Enter the beats counted in 30 seconds.',1);return}const k=keyNow();D.R[k]=Object.assign(D.R[k]||{},{pulse:v*2});$('#pcount').value='';msg(`Pulse ${v*2} per minute saved.`);render()});
$('#next').addEventListener('click',()=>{if(STEPS[D.step].ok()){D.step++;if(D.step===2){D.pos='lying'}render()}});
$('#back').addEventListener('click',()=>{if(D.step>0){D.step--;render()}});
/* report */
function report(){
  const L=D.R.lying||{},s1=D.R.stand1||{},s3=D.R.stand3||{};
  const dS=Math.max(L.sys-s1.sys,L.sys-s3.sys),dD=Math.max(L.dia-s1.dia,L.dia-s3.dia),dH=Math.max(s1.pulse-L.pulse,s3.pulse-L.pulse);
  const oh=dS>=20||dD>=10,pots=!oh&&dH>=30,ans=D.ans;
  const accOk=k=>{const t=truth(k),r=D.R[k]||{};return r.sys!=null&&Math.abs(r.sys-t.sys)<=6&&Math.abs(r.dia-t.dia)<=6};
  const pulOk=k=>{const t=truth(k),r=D.R[k]||{};return r.pulse!=null&&Math.abs(r.pulse-t.hr)<=6};
  D.calc={oh,pots,dS,dD,dH,res:oh?'Orthostatic hypotension':pots?'Postural tachycardia':'Normal response'};
  const rows=KEYS.map(([k,l])=>{const r=D.R[k]||{},t=truth(k);return `<tr><td>${l}</td><td>${r.sys}/${r.dia}</td><td>${t.sys}/${t.dia}</td><td class="${accOk(k)?'ok':'bad'}">${accOk(k)?'✓':'✗'}</td><td>${r.pulse}</td><td>${t.hr}</td><td class="${pulOk(k)?'ok':'bad'}">${pulOk(k)?'✓':'✗'}</td></tr>`}).join('');
  return `<div class="eyebrow">Your results</div><h2>${D.name}, ${D.age} y</h2><div class="scroll"><table><tr><th>Position</th><th>Your BP</th><th>True BP</th><th></th><th>Your pulse</th><th>True</th><th></th></tr>${rows}</table></div>
  <div class="kv" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))"><div>Fall in systolic BP<b>${dS} mmHg</b></div><div>Fall in diastolic BP<b>${dD} mmHg</b></div><div>Rise in pulse<b>${dH} /min</b></div></div>
  <div class="two" style="max-width:660px"><div><span class="lab">Your interpretation</span><select id="aRes" ${ans?'disabled':''}><option value="">Select</option>${['Normal response','Orthostatic hypotension','Postural tachycardia'].map(x=>`<option ${ans&&ans.res===x?'selected':''}>${x}</option>`).join('')}</select></div>
  <div><span class="lab">Which reflex restores the BP on standing?</span><select id="aRef" ${ans?'disabled':''}><option value="">Select</option>${['Baroreceptor reflex','Chemoreceptor reflex','Bainbridge reflex','Cushing reflex'].map(x=>`<option ${ans&&ans.ref===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
  <div class="row" style="margin-top:12px"><button class="btn acc" id="sub" ${ans?'disabled':''}>Submit to examiner</button></div><div id="sc">${ans?score(accOk,pulOk):''}</div>`}
function score(accOk,pulOk){const prep=PREPS.filter(([k])=>D.prep[k]).length,acc=KEYS.filter(([k])=>accOk(k)).length,pul=KEYS.filter(([k])=>pulOk(k)).length>=3?1:0,rOk=D.ans.res===D.calc.res?1:0,fOk=D.ans.ref==='Baroreceptor reflex'?1:0,tot=prep+acc+pul+rOk+fOk;
  const row=(ok,t)=>`<div class="ck"><span class="${ok?'ok':'bad'}">${ok?'✓':'✗'}</span><span>${t}</span></div>`;
  const why={ 'Normal response':'Systolic fell less than 20 and diastolic did not fall by 10. The baroreceptor reflex compensated well.','Orthostatic hypotension':'Systolic fell by 20 or more, or diastolic by 10 or more, within 3 minutes of standing. The reflex failed to compensate fully.','Postural tachycardia':'Pulse rose by 30 or more without a fall in BP: the heart rate is doing all the compensating.'}[D.calc.res];
  return `<div class="score" style="margin-top:18px">${tot}<small> / 11</small></div><p class="mut">${why}</p><div class="checks">${row(prep===4,`Preparation: ${prep} of 4`)}${row(acc===4,`BP readings within 6 mmHg of the true value: ${acc} of 4`)}${row(pul,'Pulse readings accurate')}${row(rOk,'Interpretation: '+D.calc.res)}${row(fOk,'Reflex: baroreceptor reflex')}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="again">New subject</button></div>`}
function wireReport(){const s=$('#sub');if(s)s.addEventListener('click',()=>{const res=$('#aRes').value,ref=$('#aRef').value;if(!res||!ref)return;D.ans={res,ref};render()});const a=$('#again');if(a)a.addEventListener('click',newSubject)}
/* loop */
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;const c=D.cuff,k=keyNow(),rate=+$('#rate').value;
  if(c.pump)c.P=Math.min(300,c.P+55*dt);else if(c.valve||(c.P>0&&false))c.P=Math.max(0,c.P-rate*dt);
  if(c.P>0&&!c.pump&&!c.valve)c.P=Math.max(0,c.P-.05*dt);
  const t=k?truth(k):null;let audible=false;
  if(t){c.beat+=t.hr/60*dt;if(Math.floor(c.beat)>c.events){c.events=Math.floor(c.beat);if(c.steth&&c.P<t.sys&&c.P>t.dia){audible=true;thump()}}}
  const ki=document.querySelector('.kor i'),kt=$('#korT');if(ki){ki.classList.toggle('on',audible||(D.palp&&Math.sin(performance.now()/1000*(t?t.hr:70)/60*6.28)>.9));
    kt.textContent=!c.steth?'Place the stethoscope on the artery':c.P<=0?'Cuff empty':c.P>(t?t.sys:200)?'Cuff above systolic: no sound':audible?'TAP':(c.P>(t?t.dia:80)?'Listening':'Sounds gone')}
  if(c.P>(t?t.sys+0:300)+60&&false){}
  const cp=document.getElementById('cp');if(cp)cp.textContent=Math.round(c.P);
  if(c.valve&&rate>5&&Math.random()<.01)msg('Deflate at 2 to 3 mmHg per second for an accurate reading.',1);
  drawMano();
  if(((c.P>20)!==c._inf)){c._inf=c.P>20;pose()}
  requestAnimationFrame(loop)}
mano();newSubject();requestAnimationFrame(loop);

</script>
<script>
(function(){
 var ID=document.documentElement.getAttribute('data-sim')||'';
 if(window.parent===window)return;
 document.documentElement.classList.add('emb');
 function theme(){try{var d=parent.document.documentElement.classList.contains('dark');document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}}
 theme();try{new MutationObserver(theme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 var last='';
 function post(){var h=document.documentElement.scrollHeight;parent.postMessage({qp:'height',h:h},'*');

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LEADS=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'];
const LANG={I:0,II:60,III:120,aVR:-150,aVL:-30,aVF:90};
const CH={V1:{p:.06,q:0,r:.25,s:1.1,t:-.1},V2:{p:.08,q:0,r:.5,s:1.0,t:.35},V3:{p:.09,q:.02,r:.8,s:.7,t:.4},V4:{p:.1,q:.05,r:1.3,s:.35,t:.45},V5:{p:.1,q:.1,r:1.4,s:.1,t:.38},V6:{p:.09,q:.1,r:1.1,s:.05,t:.3}};
const RHY=[{k:'nsr',n:'Normal sinus rhythm',hr:[62,92],pr:.16},{k:'tachy',n:'Sinus tachycardia',hr:[108,135],pr:.14},{k:'brady',n:'Sinus bradycardia',hr:[42,54],pr:.18},{k:'af',n:'Atrial fibrillation',hr:[95,150],pr:0},{k:'avb1',n:'First-degree AV block',hr:[60,78],pr:.30}];
const AXES=[{k:'n',n:'Normal axis',a:[30,75]},{k:'lad',n:'Left axis deviation',a:[-60,-35]},{k:'rad',n:'Right axis deviation',a:[105,135]}];
let P,B;
const g=(d,c,s)=>Math.exp(-.5*((d-c)/s)**2);
function genBeats(){B=[];let t=-1.2;const rr0=60/P.hr;while(t<420){const af=P.rhythm.k==='af';const rr=af?rr0*(.5+.95*Math.random()):rr0*(1+(Math.random()-.5)*.04);t+=rr;B.push({t,rr,pr:P.rhythm.pr})}}
function newPatientData(forceNsr){const r=forceNsr?RHY[0]:pick(RHY),a=!forceNsr&&Math.random()>.6?pick(AXES.slice(1)):AXES[0];
  P={rhythm:r,axisK:a,axis:Math.round(rnd(a.a[0],a.a[1])),hr:forceNsr?75:Math.round(rnd(r.hr[0],r.hr[1]))};genBeats();return P}
function lb(t){let lo=0,hi=B.length;while(lo<hi){const m=(lo+hi)>>1;if(B[m].t<t)lo=m+1;else hi=m}return lo}
function params(l,axis){const ax=axis===undefined?P.axis:axis;if(LANG[l]===undefined)return CH[l];
  const a=LANG[l],v=Math.cos((ax-a)*Math.PI/180),d=x=>Math.cos(x*Math.PI/180);
  return{p:.15*d(60-a),q:v>.2?.07:0,r:Math.max(v,0)*1.25+.12,s:Math.max(-v,0)*1.1+.12,t:.35*d(45-a)}}
function beatVal(d,rr,pr,pm,af){let v=-pm.q*g(d,-.028,.008)+pm.r*g(d,0,.011)-pm.s*g(d,.026,.010)+pm.t*g(d,.17+.10*Math.sqrt(rr),.05);if(!af)v+=pm.p*g(d,-pr+.01,.022);return v}
function val(t,pm){let v=0,i=lb(t-.75);for(;i<B.length&&B[i].t<t+.45;i++){const b=B[i];v+=beatVal(t-b.t,b.rr,b.pr,pm,P.rhythm.k==='af')}
  v+=.03*Math.sin(6.28*.22*t);if(P.rhythm.k==='af')v+=.05*Math.sin(6.28*6*t)+.03*Math.sin(6.28*7.3*t+1);
  const n=Math.sin(Math.floor(t*400)*12.9898)*43758.5453;v+=.014*((n-Math.floor(n))-.5);return v}
function drawGrid(c,W,H,pxmm,off,bgc){
  c.fillStyle=bgc||'#fdeff1';c.fillRect(0,0,W,H);const base=W-off,a=((base%pxmm)+pxmm)%pxmm;
  for(let x=a;x<=W+1;x+=pxmm){const k=Math.round((x-base)/pxmm),M=((k%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,H);c.stroke()}
  for(let j=-Math.ceil(H/2/pxmm);j<=Math.ceil(H/2/pxmm);j++){const y=H/2+j*pxmm,M=((j%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(0,Math.round(y)+.5);c.lineTo(W,Math.round(y)+.5);c.stroke()}}
function fitCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,W:r.width,H:r.height}}

/* Shared stepper for every practical. Each simulator passes steps with: t, d, do[], why, tips[], ok(), body(), main(), wire(), msg(). */
function Kit(cfg){
  const app=$('#app');
  app.innerHTML=`<div class="wrap"><header><div><div class="eyebrow">Physiology practical · Virtual lab</div><h1>${cfg.title}</h1><p class="sub">${cfg.sub}</p></div><div class="pill" id="pt"></div></header>
  <div class="steps" id="steps"></div><div id="main"></div>
  <div class="card coach" style="margin-top:18px"><div><div class="pill" id="stepTag"></div><h2 id="cTitle" style="margin-top:8px"></h2><div class="mut" id="cText"></div><div class="msg" id="cMsg"></div><div id="cBody"></div></div>
  <div class="row"><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div></div>`;
  const K={step:0,cfg};
  const det=s=>s.do?`<div class="detail"><div><h3>What to do</h3><ol>${s.do.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>Why it matters</h3><p>${s.why||''}</p>${s.tips&&s.tips.length?`<h3>Examiner's tips</h3><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div></div>`:'';
  K.render=function(keepMain){
    const S=cfg.steps,st=S[K.step];
    $('#steps').innerHTML=S.map((s,i)=>`<div class="st ${i===K.step?'on':i<K.step?'done':''}"><b>${i<K.step?'✓':i+1}</b>${s.short||s.t}</div>`).join('');
    $('#stepTag').textContent=`Step ${K.step+1} of ${S.length}`;$('#cTitle').textContent=st.t;$('#cText').textContent=st.d||'';
    $('#cBody').innerHTML=(st.body?st.body():'')+det(st);
    if(!keepMain){$('#main').innerHTML=st.main?st.main():'';}
    const last=K.step===S.length-1;$('#back').disabled=K.step===0||(st.lockBack&&st.lockBack());$('#next').hidden=last&&!st.next;$('#next').disabled=!(st.ok?st.ok():true);
    const m=st.msg?st.msg():null,el=$('#cMsg');el.className='msg'+(m&&m[1]?' '+m[1]:'');el.textContent=m?m[0]:'';
    if(!keepMain&&st.wire)st.wire();if(st.after)st.after();
  };
  $('#next').addEventListener('click',()=>{const st=cfg.steps[K.step];if(st.ok&&!st.ok())return;if(st.leave)st.leave();K.step++;K.render()});
  $('#back').addEventListener('click',()=>{if(K.step>0){K.step--;K.render()}});
  K.refresh=()=>K.render(true);K.redraw=()=>K.render(false);
  return K;
}
Kit.score=(items,again)=>{const tot=items.reduce((a,i)=>a+i[0],0),mx=items.reduce((a,i)=>a+i[1],0);
  return `<div class="score" style="margin-top:18px">${tot}<small> / ${mx}</small></div><div class="checks">${items.map(([p,m,t])=>`<div class="ck"><span class="${p>=m?'ok':'bad'}">${p>=m?'✓':'✗'}</span><span>${t}${m>1?` (${p} of ${m})`:''}</span></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="again">New subject</button></div>`};
const chipRow=(items,state,key)=>`<div class="row" style="margin-top:12px">${items.map(([k,l])=>`<button class="chip" data-chip="${k}" aria-pressed="${!!state[k]}">${l}</button>`).join('')}</div>`;
const wireChips=(state,cb)=>$$('[data-chip]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.chip]=!state[b.dataset.chip];cb()}));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const NAMES=['Ravi K.','Sneha P.','Imran S.','Anita R.','Mahesh D.','Farah N.','Kiran B.','Lakshmi T.'];
let AC;document.addEventListener('pointerdown',()=>{if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function tone(f,dur,gain){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(gain||.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur+.02)}catch(e){}}

const LINES=[[60,'E'],[36,'FP'],[24,'TOZ'],[18,'LPED'],[12,'PECFD'],[9,'EDFCZP'],[6,'FELOPZD']];
const PRE=[['consent','Explain the test and seat the subject 6 metres from the chart'],['light','Check the chart is well lit and at eye level'],['occ','Use an occluder, no pressure on the eye closed'],['gl','Ask the subject to remove spectacles for the unaided test']];
const TYPES=[{n:'Normal',R:[6,6],L:[6,6],ans:{R:'Normal',L:'Normal'}},{n:'Myopia right',R:[24,9],L:[6,6],ans:{R:'Refractive error',L:'Normal'}},{n:'Organic left',R:[6,6],L:[60,60],ans:{R:'Normal',L:'Organic cause'}},{n:'Both refractive',R:[12,6],L:[12,6],ans:{R:'Refractive error',L:'Refractive error'}}];
let V,sel={eye:'R',pin:false,line:null,reads:null,show:false};
const LET='EFPTOZLDCH';
function newSubject(){V={prep:{},T:pick(TYPES),rec:{},ans:null,name:pick(NAMES),age:Math.round(rnd(14,60))};sel={eye:'R',pin:false,line:null,reads:null,show:false};$('#pt').textContent=`Subject: ${V.name} · ${V.age} y`}
const den=(eye,pin)=>V.T[eye][pin?1:0];
function reads(line){const d=den(sel.eye,sel.pin),L=LINES[line],txt=L[1].split('');const ok=L[0]>=d;
  const out=txt.map((c,i)=>ok||i<1&&Math.random()<.5?c:LET[Math.floor(Math.random()*LET.length)]);const n=out.filter((c,i)=>c===txt[i]).length;return{out,n,total:txt.length}}
function chart(){const d=den(sel.eye,sel.pin),blur=sel.show?Math.max(0,(d-6)/6*1.1):0;
  return `<div class="chart" style="filter:blur(${blur}px)">${LINES.map((l,i)=>`<button class="cl ${sel.line===i?'on':''}" data-l="${i}" style="font-size:${l[0]*1.7+6}px"><span class="den">6/${l[0]}</span><span class="lt">${l[1].split('').join(' ')}</span></button>`).join('')}</div>`}
function main(stage){return `<div class="cols"><div class="stage"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="pill">Snellen chart at 6 m</span><button class="chip" id="view" aria-pressed="${sel.show}">Show how the subject sees it</button></div><div id="chartwrap">${chart()}</div></div>
 <div class="panel"><div id="face">${face()}</div><div class="row" style="margin:10px 0"><span class="lab" style="margin:0">Testing</span><div class="seg" id="eye"><button data-e="R" aria-pressed="${sel.eye==='R'}">Right eye</button><button data-e="L" aria-pressed="${sel.eye==='L'}">Left eye</button></div><button class="chip" id="pin" aria-pressed="${sel.pin}">Pinhole</button></div>
 <div class="say" id="say">Tap a line of the chart to ask the subject to read it.</div>
 <div class="row" style="margin-top:12px"><span class="lab" style="margin:0">Acuity</span><select id="acu" style="max-width:130px"><option value="">Select</option>${LINES.map(l=>`<option>6/${l[0]}</option>`).join('')}</select><button class="btn acc" id="rec">Record for ${sel.eye==='R'?'right':'left'} eye${sel.pin?' with pinhole':''}</button></div>
 <div class="scroll" style="margin-top:10px"><table><tr><th>Eye</th><th>Unaided</th><th>Pinhole</th></tr>${['R','L'].map(e=>`<tr><td>${e==='R'?'Right':'Left'}</td><td>${V.rec[e+'u']||'-'}</td><td>${V.rec[e+'p']||'-'}</td></tr>`).join('')}</table></div></div></div>`}
function face(){const cov=sel.eye==='R'?'L':'R';return `<svg viewBox="0 0 220 90" style="width:100%;max-width:300px;display:block;margin:0 auto"><ellipse cx="110" cy="45" rx="100" ry="38" style="fill:var(--skin);stroke:var(--skin2)"/><g fill="#fff" stroke="#8a95a8"><ellipse cx="72" cy="45" rx="20" ry="11"/><ellipse cx="148" cy="45" rx="20" ry="11"/></g><circle cx="72" cy="45" r="6" fill="#2b3340"/><circle cx="148" cy="45" r="6" fill="#2b3340"/><text x="72" y="82" text-anchor="middle" font-size="10" fill="var(--mfg)" font-family="Inter">Subject's right</text><text x="148" y="82" text-anchor="middle" font-size="10" fill="var(--mfg)" font-family="Inter">left</text>
 <rect x="${cov==='R'?48:124}" y="28" width="48" height="34" rx="8" fill="#3c465a" opacity=".92"/><text x="${cov==='R'?72:148}" y="49" text-anchor="middle" font-size="9" fill="#fff" font-family="Inter">covered</text>
 ${sel.pin?`<g transform="translate(${sel.eye==='R'?72:148} 45)"><circle r="14" fill="#1b2338"/><circle r="2" fill="#fff"/></g>`:''}</svg>`}
function wire(){
  $$('.cl').forEach(b=>b.onclick=()=>{sel.line=+b.dataset.l;sel.reads=reads(sel.line);const r=sel.reads;$('#say').innerHTML=`Subject reads: <b>${r.out.join(' ')}</b><br><span class="mut">${r.n} of ${r.total} correct</span>`;$$('.cl').forEach(x=>x.classList.toggle('on',+x.dataset.l===sel.line))});
  $$('#eye button').forEach(b=>b.onclick=()=>{sel.eye=b.dataset.e;sel.line=null;K.redraw()});$('#pin').onclick=()=>{sel.pin=!sel.pin;K.redraw()};$('#view').onclick=()=>{sel.show=!sel.show;K.redraw()};
  $('#rec').onclick=()=>{const a=$('#acu').value;if(!a)return;V.rec[sel.eye+(sel.pin?'p':'u')]=a;K.refresh();K.redraw()}}
function report(){const g=e=>V.rec[e+'u']&&V.rec[e+'p']?'':'',res=(e)=>{const u=+((V.rec[e+'u']||'6/6').split('/')[1]),p=V.rec[e+'p']?+V.rec[e+'p'].split('/')[1]:u;return u<=6?'Normal':p<u?'Refractive error':'Organic cause'};
  return `<div class="panel"><div class="eyebrow">Your results</div><h2>${V.name}</h2><div class="scroll"><table><tr><th>Eye</th><th>Unaided</th><th>Pinhole</th>${V.ans?'<th>True unaided</th>':''}</tr>${['R','L'].map(e=>`<tr><td>${e==='R'?'Right':'Left'}</td><td>${V.rec[e+'u']||'-'}</td><td>${V.rec[e+'p']||'not done'}</td>${V.ans?`<td>6/${V.T[e][0]}</td>`:''}</tr>`).join('')}</table></div>
  <div class="two"><div><span class="lab">Right eye: your interpretation</span><select id="aR" ${V.ans?'disabled':''}><option value="">Select</option>${['Normal','Refractive error','Organic cause'].map(o=>`<option ${V.ans&&V.ans.R===o?'selected':''}>${o}</option>`).join('')}</select></div><div><span class="lab">Left eye: your interpretation</span><select id="aL" ${V.ans?'disabled':''}><option value="">Select</option>${['Normal','Refractive error','Organic cause'].map(o=>`<option ${V.ans&&V.ans.L===o?'selected':''}>${o}</option>`).join('')}</select></div></div>
  <div class="row" style="margin-top:12px"><button class="btn acc" id="sub" ${V.ans?'disabled':''}>Submit to examiner</button></div><div>${V.ans?sc(res):''}</div></div>`}
function sc(res){const prep=PRE.filter(([k])=>V.prep[k]).length,acc=['R','L'].filter(e=>V.rec[e+'u']===`6/${V.T[e][0]}`).length,pin=['R','L'].every(e=>+V.T[e][0]<=6||V.rec[e+'p'])?1:0,i=['R','L'].filter(e=>V.ans[e]===V.T.ans[e]).length;
  return Kit.score([[prep,4,'Preparation'],[acc,2,'Unaided acuity recorded correctly'],[pin,1,'Pinhole test done for any eye worse than 6/6'],[i,2,'Interpretation']])+`<p class="mut" style="margin-top:12px">Improvement with a pinhole means a refractive error. No improvement points to disease of the retina, optic nerve or media (organic cause).</p>`}
const K=Kit({title:'Visual Acuity',sub:'Test distance vision with a Snellen chart, each eye separately, then use a pinhole to tell a refractive error from disease.',steps:[
 {t:'Prepare the subject and chart',short:'Prepare',d:'Set up the room and the subject.',ok:()=>PRE.every(([k])=>V.prep[k]),body:()=>chipRow(PRE,V.prep),wire:()=>wireChips(V.prep,()=>K.refresh()),
  do:['Explain the test. Seat the subject exactly 6 metres from the chart.','The chart should be well lit and at the level of the eyes.','Test each eye separately with an occluder, without pressing on the closed eye.','Remove spectacles for the unaided test. Note if the subject wears them.'],why:'Snellen letters subtend 5 minutes of arc at the stated distance, and each stroke subtends 1 minute. At 6 m a person with normal vision (6/6) reads the 6 m line. 6/60 means the subject sees at 6 m what a normal eye sees at 60 m.',tips:['Test the better-seeing eye first only if told; otherwise start with the right eye.','Vision is the smallest line read correctly, with at most 1 or 2 mistakes.']},
 {t:'Right eye unaided',short:'Right eye',d:'Cover the left eye. Ask the subject to read down the chart and record the smallest line read.',main:()=>main(),wire,ok:()=>!!V.rec.Ru,
  do:['Cover the left eye. Make sure the Right eye button is selected.','Tap a line to ask the subject to read it. Start with the large letters and go down.','Record the smallest line read correctly as 6/xx.'],why:'Each eye is tested alone because one eye may be much worse than the other and the better eye hides the defect.',tips:['If the subject cannot read the top line, move closer: count fingers, hand movements, light perception.']},
 {t:'Left eye unaided',short:'Left eye',d:'Now cover the right eye and test the left.',main:()=>main(),wire,ok:()=>!!V.rec.Lu,do:['Cover the right eye and select the Left eye button.','Test the lines in the same way. Record the acuity.'],why:'Comparing the two eyes shows whether the defect is in one eye only.',tips:[]},
 {t:'Pinhole test',short:'Pinhole',d:'Repeat for any eye worse than 6/6 with a pinhole in front of it.',main:()=>main(),wire,ok:()=>['R','L'].every(e=>+V.T[e][0]<=6||V.rec[e+'p']),
  do:['Press Pinhole to put a pinhole disc in front of the eye that read worse than 6/6.','Ask the subject to read again. Record the new acuity for that eye.','Do the same for the other eye if it is also worse than 6/6.'],why:'A pinhole cuts out the peripheral rays so only central rays reach the retina. This removes the blur of a refractive error and vision improves. If vision does not improve, the cause is organic.',tips:['Pinhole improvement: myopia, hypermetropia, astigmatism.','No improvement: cataract, macular disease, optic nerve disease, amblyopia.']},
 {t:'Report and interpret',short:'Report',d:'Say whether each eye is normal, has a refractive error, or an organic problem.',main:()=>report(),wire:()=>{const s=$('#sub');if(s)s.onclick=()=>{const r=$('#aR').value,l=$('#aL').value;if(!r||!l)return;V.ans={R:r,L:l};K.redraw()};const g=$('#again');if(g)g.onclick=()=>{newSubject();K.step=0;K.redraw()}},do:['Look at the unaided and pinhole vision for each eye.','Decide: normal, refractive error, or organic cause.'],why:'The pinhole test is a quick bedside way to decide whether glasses will help.',tips:[]}]});
newSubject();K.render();

</script>
<script>
(function(){
 var ID=document.documentElement.getAttribute('data-sim')||'';
 if(window.parent===window)return;
 document.documentElement.classList.add('emb');
 function theme(){try{var d=parent.document.documentElement.classList.contains('dark');document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}}
 theme();try{new MutationObserver(theme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 var last='';
 function post(){var h=document.documentElement.scrollHeight;parent.postMessage({qp:'height',h:h},'*');
  var s=document.querySelector('.score');if(s){var m=s.textContent.replace(/\s+/g,'').match(/^(\d+)\/(\d+)/);if(m){var k=m[1]+'/'+m[2];if(k!==last){last=k;parent.postMessage({qp:'score',tot:+m[1],max:+m[2]},'*')}}}}
 try{new MutationObserver(post).observe(document.body,{childList:true,subtree:true,attributes:true});new ResizeObserver(post).observe(document.body)}catch(e){}
 window.addEventListener('load',post);setTimeout(post,300);
})();
</script></body></html>

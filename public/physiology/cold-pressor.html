<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LEADS=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'];
const LANG={I:0,II:60,III:120,aVR:-150,aVL:-30,aVF:90};
const CH={V1:{p:.06,q:0,r:.25,s:1.1,t:-.1},V2:{p:.08,q:0,r:.5,s:1.0,t:.35},V3:{p:.09,q:.02,r:.8,s:.7,t:.4},V4:{p:.1,q:.05,r:1.3,s:.35,t:.45},V5:{p:.1,q:.1,r:1.4,s:.1,t:.38},V6:{p:.09,q:.1,r:1.1,s:.05,t:.3}};
const RHY=[{k:'nsr',n:'Normal sinus rhythm',hr:[62,92],pr:.16},{k:'tachy',n:'Sinus tachycardia',hr:[108,135],pr:.14},{k:'brady',n:'Sinus bradycardia',hr:[42,54],pr:.18},{k:'af',n:'Atrial fibrillation',hr:[95,150],pr:0},{k:'avb1',n:'First-degree AV block',hr:[60,78],pr:.30}];
const AXES=[{k:'n',n:'Normal axis',a:[30,75]},{k:'lad',n:'Left axis deviation',a:[-60,-35]},{k:'rad',n:'Right axis deviation',a:[105,135]}];
let P,B;
const g=(d,c,s)=>Math.exp(-.5*((d-c)/s)**2);
function genBeats(){B=[];let t=-1.2;const rr0=60/P.hr;while(t<420){const af=P.rhythm.k==='af';const rr=af?rr0*(.5+.95*Math.random()):rr0*(1+(Math.random()-.5)*.04);t+=rr;B.push({t,rr,pr:P.rhythm.pr})}}
function newPatientData(forceNsr){const r=forceNsr?RHY[0]:pick(RHY),a=!forceNsr&&Math.random()>.6?pick(AXES.slice(1)):AXES[0];
  P={rhythm:r,axisK:a,axis:Math.round(rnd(a.a[0],a.a[1])),hr:forceNsr?75:Math.round(rnd(r.hr[0],r.hr[1]))};genBeats();return P}
function lb(t){let lo=0,hi=B.length;while(lo<hi){const m=(lo+hi)>>1;if(B[m].t<t)lo=m+1;else hi=m}return lo}
function params(l,axis){const ax=axis===undefined?P.axis:axis;if(LANG[l]===undefined)return CH[l];
  const a=LANG[l],v=Math.cos((ax-a)*Math.PI/180),d=x=>Math.cos(x*Math.PI/180);
  return{p:.15*d(60-a),q:v>.2?.07:0,r:Math.max(v,0)*1.25+.12,s:Math.max(-v,0)*1.1+.12,t:.35*d(45-a)}}
function beatVal(d,rr,pr,pm,af){let v=-pm.q*g(d,-.028,.008)+pm.r*g(d,0,.011)-pm.s*g(d,.026,.010)+pm.t*g(d,.17+.10*Math.sqrt(rr),.05);if(!af)v+=pm.p*g(d,-pr+.01,.022);return v}
function val(t,pm){let v=0,i=lb(t-.75);for(;i<B.length&&B[i].t<t+.45;i++){const b=B[i];v+=beatVal(t-b.t,b.rr,b.pr,pm,P.rhythm.k==='af')}
  v+=.03*Math.sin(6.28*.22*t);if(P.rhythm.k==='af')v+=.05*Math.sin(6.28*6*t)+.03*Math.sin(6.28*7.3*t+1);
  const n=Math.sin(Math.floor(t*400)*12.9898)*43758.5453;v+=.014*((n-Math.floor(n))-.5);return v}
function drawGrid(c,W,H,pxmm,off,bgc){
  c.fillStyle=bgc||'#fdeff1';c.fillRect(0,0,W,H);const base=W-off,a=((base%pxmm)+pxmm)%pxmm;
  for(let x=a;x<=W+1;x+=pxmm){const k=Math.round((x-base)/pxmm),M=((k%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,H);c.stroke()}
  for(let j=-Math.ceil(H/2/pxmm);j<=Math.ceil(H/2/pxmm);j++){const y=H/2+j*pxmm,M=((j%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(0,Math.round(y)+.5);c.lineTo(W,Math.round(y)+.5);c.stroke()}}
function fitCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,W:r.width,H:r.height}}

/* Shared stepper for every practical. Each simulator passes steps with: t, d, do[], why, tips[], ok(), body(), main(), wire(), msg(). */
function Kit(cfg){
  const app=$('#app');
  app.innerHTML=`<div class="wrap"><header><div><div class="eyebrow">Physiology practical · Virtual lab</div><h1>${cfg.title}</h1><p class="sub">${cfg.sub}</p></div><div class="pill" id="pt"></div></header>
  <div class="steps" id="steps"></div><div id="main"></div>
  <div class="card coach" style="margin-top:18px"><div><div class="pill" id="stepTag"></div><h2 id="cTitle" style="margin-top:8px"></h2><div class="mut" id="cText"></div><div class="msg" id="cMsg"></div><div id="cBody"></div></div>
  <div class="row"><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div></div>`;
  const K={step:0,cfg};
  const det=s=>s.do?`<div class="detail"><div><h3>What to do</h3><ol>${s.do.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>Why it matters</h3><p>${s.why||''}</p>${s.tips&&s.tips.length?`<h3>Examiner's tips</h3><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div></div>`:'';
  K.render=function(keepMain){
    const S=cfg.steps,st=S[K.step];
    $('#steps').innerHTML=S.map((s,i)=>`<div class="st ${i===K.step?'on':i<K.step?'done':''}"><b>${i<K.step?'✓':i+1}</b>${s.short||s.t}</div>`).join('');
    $('#stepTag').textContent=`Step ${K.step+1} of ${S.length}`;$('#cTitle').textContent=st.t;$('#cText').textContent=st.d||'';
    $('#cBody').innerHTML=(st.body?st.body():'')+det(st);
    if(!keepMain){$('#main').innerHTML=st.main?st.main():'';}
    const last=K.step===S.length-1;$('#back').disabled=K.step===0||(st.lockBack&&st.lockBack());$('#next').hidden=last&&!st.next;$('#next').disabled=!(st.ok?st.ok():true);
    const m=st.msg?st.msg():null,el=$('#cMsg');el.className='msg'+(m&&m[1]?' '+m[1]:'');el.textContent=m?m[0]:'';
    if(!keepMain&&st.wire)st.wire();if(st.after)st.after();
  };
  $('#next').addEventListener('click',()=>{const st=cfg.steps[K.step];if(st.ok&&!st.ok())return;if(st.leave)st.leave();K.step++;K.render()});
  $('#back').addEventListener('click',()=>{if(K.step>0){K.step--;K.render()}});
  K.refresh=()=>K.render(true);K.redraw=()=>K.render(false);
  return K;
}
Kit.score=(items,again)=>{const tot=items.reduce((a,i)=>a+i[0],0),mx=items.reduce((a,i)=>a+i[1],0);
  return `<div class="score" style="margin-top:18px">${tot}<small> / ${mx}</small></div><div class="checks">${items.map(([p,m,t])=>`<div class="ck"><span class="${p>=m?'ok':'bad'}">${p>=m?'✓':'✗'}</span><span>${t}${m>1?` (${p} of ${m})`:''}</span></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="again">New subject</button></div>`};
const chipRow=(items,state,key)=>`<div class="row" style="margin-top:12px">${items.map(([k,l])=>`<button class="chip" data-chip="${k}" aria-pressed="${!!state[k]}">${l}</button>`).join('')}</div>`;
const wireChips=(state,cb)=>$$('[data-chip]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.chip]=!state[b.dataset.chip];cb()}));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const NAMES=['Ravi K.','Sneha P.','Imran S.','Anita R.','Mahesh D.','Farah N.','Kiran B.','Lakshmi T.'];
let AC;document.addEventListener('pointerdown',()=>{if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function tone(f,dur,gain){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(gain||.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur+.02)}catch(e){}}

const PRE=[['rest','Subject rests lying or sitting for at least 10 minutes'],['ice','Prepare ice water at 4 °C (use a thermometer)'],['bp','Wrap the BP cuff on the other arm, not the immersed one'],['expl','Explain that the cold will be painful but not harmful, and the subject may withdraw if unbearable']];
const TYPES=[{n:'Normoreactor',dS:12,dD:9,rec:3},{n:'Hyperreactor',dS:30,dD:22,rec:5},{n:'Normoreactor',dS:15,dD:12,rec:3}];
const MC=[['The rise in BP during the cold pressor test is mainly due to…',['Sympathetic activation','Parasympathetic activation','Vasodilatation'],0],['Which pathway carries the cold-pain stimulus?',['Spinothalamic tract','Dorsal column','Corticospinal tract'],0]];
let V,tl;
function newSubject(){const T=pick(TYPES),b=[Math.round(rnd(108,126)),Math.round(rnd(68,82))];V={prep:{},T,b,name:pick(NAMES),age:Math.round(rnd(18,28)),rec:[],ans:null,q:{},done:0,hand:null};$('#pt').textContent=`Subject: ${V.name} · ${V.age} y`}
const j=()=>Math.round(rnd(-2,2));
function bp(t){const T=V.T;if(t<=0)return[V.b[0]+j(),V.b[1]+j()];if(V.hand!=null&&t<=60){const f=t===30?.55:1;return[V.b[0]+Math.round(T.dS*f)+j(),V.b[1]+Math.round(T.dD*f)+j()]}
 const m=t-60;const f=Math.max(0,1-m/(T.rec*60));return[V.b[0]+Math.round(T.dS*f)+j(),V.b[1]+Math.round(T.dD*f)+j()]}
const has=t=>V.rec.find(r=>r.t===t),stage=()=>V.rec.length;
function take(t,label){if(has(t))return;const b=bp(t);V.rec.push({t,label,s:b[0],d:b[1]});V.rec.sort((a,b)=>a.t-b.t)}
function chart(){const cv=$('#ch');if(!cv)return;const{c,W,H}=fitCanvas(cv);const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();c.clearRect(0,0,W,H);c.fillStyle=css('--card');c.fillRect(0,0,W,H);const x0=40,x1=W-14,y0=12,y1=H-30,lo=50,hi=170,X=t=>x0+(x1-x0)*(t+60)/(60+60+360),Y=v=>y1-(y1-y0)*(v-lo)/(hi-lo);
 c.font='11px Inter';c.fillStyle=css('--mfg');c.strokeStyle=css('--bd');for(let v=60;v<=160;v+=20){c.beginPath();c.moveTo(x0,Y(v));c.lineTo(x1,Y(v));c.stroke();c.textAlign='right';c.fillText(v,x0-6,Y(v)+4)}
 c.fillStyle='rgba(47,109,240,.12)';c.fillRect(X(0),y0,X(60)-X(0),y1-y0);c.fillStyle=css('--mfg');c.textAlign='center';c.fillText('hand in ice water',(X(0)+X(60))/2,y0+12);[-0,60,120,180,240,300,360].forEach(t=>c.fillText(t/60+' min',X(t),y1+16));
 const pts=V.rec.map(r=>({t:r.t,s:r.s,d:r.d}));[['s','--acc'],['d','--pri']].forEach(([k,col])=>{c.strokeStyle=css(col);c.fillStyle=css(col);c.lineWidth=2.2;c.beginPath();pts.forEach((p,i)=>{i?c.lineTo(X(p.t),Y(p[k])):c.moveTo(X(p.t),Y(p[k]))});c.stroke();pts.forEach(p=>{c.beginPath();c.arc(X(p.t),Y(p[k]),4,0,7);c.fill()})});c.textAlign='left';c.fillStyle=css('--acc');c.fillText('Systolic',x0+6,y1-8);c.fillStyle=css('--pri');c.fillText('Diastolic',x0+70,y1-8)}
function main(){const h=V.hand!=null;const items=[[-60,'Baseline BP (rested)'],[30,'BP at 30 s of immersion'],[60,'BP at 60 s of immersion'],[120,'Recovery: 1 min after removal'],[180,'Recovery: 2 min'],[240,'Recovery: 3 min'],[300,'Recovery: 4 min'],[360,'Recovery: 5 min']];
 const can=(t,i)=>{if(has(t==-60?0:t))return false;if(t===-60)return true;if(t===30||t===60)return h&&!V.out&&has(0)&&(t===30||has(30));if(t>60)return V.out&&has(60)&&(t===120||has(t-60));return false};
 return `<div class="cols"><div class="stage"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="pill">BP against time</span></div><canvas id="ch" style="width:100%;height:300px;display:block"></canvas><svg viewBox="0 0 300 90" style="width:100%;max-width:340px;display:block;margin:8px auto 0"><rect x="70" y="20" width="160" height="60" rx="10" fill="${h&&!V.out?'#bfe0ff':'#e8eef6'}" stroke="#7aa0cc"/><text x="150" y="14" text-anchor="middle" font-size="11" fill="var(--mfg)" font-family="Inter">${h&&!V.out?'Hand in ice water (4 °C)':'Ice water bath'}</text>${h&&!V.out?'<path d="M120 20 v26 q0 12 14 12 h24 q14 0 14-12 v-26" fill="#f4c6a1" stroke="#c78e63"/>':''}<text x="150" y="70" text-anchor="middle" font-size="11" fill="#506" font-family="Inter">❄ ❄ ❄</text></svg></div>
 <div class="panel"><div class="row"><button class="btn acc" id="imm" ${h||!has(0)?'disabled':''}>Immerse hand to the wrist</button><button class="btn" id="out" ${!h||V.out||!has(60)?'disabled':''}>Withdraw hand at 60 s</button></div><span class="lab" style="margin-top:12px">Take BP (mercury / digital)</span><div class="row">${items.map(([t,l])=>{const tt=t===-60?0:t;return `<button class="btn" data-t="${tt}" ${can(t,0)?'':'disabled'}>${l}</button>`}).join('')}</div>
 <div class="scroll" style="margin-top:12px"><table><tr><th>When</th><th>BP (mmHg)</th></tr>${V.rec.length?V.rec.map(r=>`<tr><td>${r.label}</td><td>${r.s}/${r.d}</td></tr>`).join(''):'<tr><td colspan="2" class="mut">Nothing recorded.</td></tr>'}</table></div></div></div>`}
function wire(){$('#imm').onclick=()=>{V.hand=0;K.redraw()};$('#out').onclick=()=>{V.out=1;K.redraw()};$$('[data-t]').forEach(b=>b.onclick=()=>{const t=+b.dataset.t,l={0:'Baseline',30:'30 s immersed',60:'60 s immersed',120:'Recovery 1 min',180:'Recovery 2 min',240:'Recovery 3 min',300:'Recovery 4 min',360:'Recovery 5 min'}[t];take(t,l);K.redraw()});chart()}
const rise=()=>{const b=has(0),p=has(60);return b&&p?[p.s-b.s,p.d-b.d]:[0,0]};
function report(){const[rs,rd]=rise();return `<div class="panel"><div class="eyebrow">Your results</div><h2>${V.name}</h2><p>Baseline ${has(0)?has(0).s+'/'+has(0).d:'-'} · peak ${has(60)?has(60).s+'/'+has(60).d:'-'} mmHg. Rise: <b>${rs}</b> systolic / <b>${rd}</b> diastolic.</p><span class="lab">Classify the response</span><div class="row">${['Normoreactor','Hyperreactor'].map((o,i)=>`<button class="chip" data-d="${i}" aria-pressed="${V.ans===i}" ${V.done?'disabled':''}>${o}</button>`).join('')}</div>
 ${MC.map((q,i)=>`<div style="margin-top:12px"><span class="lab">${q[0]}</span><div class="row">${q[1].map((o,jx)=>`<button class="chip" data-q="${i}-${jx}" aria-pressed="${V.q[i]===jx}" ${V.done?'disabled':''}>${o}</button>`).join('')}</div></div>`).join('')}<div class="row" style="margin-top:14px"><button class="btn acc" id="sub" ${V.done?'disabled':''}>Submit to examiner</button></div>${V.done?sc():''}</div>`}
function sc(){const prep=PRE.filter(([k])=>V.prep[k]).length,b=has(0)?1:0,pk=has(30)&&has(60)?1:0,rc=[120,180,240,300,360].some(t=>has(t))?1:0,cl=['Normoreactor','Hyperreactor'][V.ans]===V.T.n?2:0,q=MC.filter((x,i)=>V.q[i]===x[2]).length;
 return Kit.score([[prep,4,'Preparation'],[b,1,'Baseline BP recorded'],[pk,1,'BP recorded at 30 s and 60 s'],[rc,1,'Recovery BP recorded'],[cl,2,'Classification'],[q,2,'Viva questions']])+`<p class="mut" style="margin-top:12px">The subject was a <b>${V.T.n}</b>. Many manuals treat a rise of diastolic BP above about 20 mmHg (systolic above about 25-30) as hyperreactive. Check the criteria in your department manual.</p>`}
const K=Kit({title:'Cold Pressor Test',sub:'Measure how strongly the sympathetic system raises BP when the hand is held in ice water.',steps:[
 {t:'Prepare',short:'Prepare',d:'Rest, ice water and apparatus.',ok:()=>PRE.every(([k])=>V.prep[k]),body:()=>chipRow(PRE,V.prep),wire:()=>wireChips(V.prep,()=>K.refresh()),do:['Let the subject lie or sit quietly for 10 minutes.','Keep the ice-water bath at about 4 °C.','Put the cuff on the opposite arm.','Explain the procedure and that the subject can withdraw if the pain becomes unbearable.'],why:'Resting BP must be stable so that the rise during the test can be measured against a baseline.',tips:['Do not test subjects with known hypertension or heart disease.']},
 {t:'Baseline, immersion and recovery',short:'Test',d:'Record baseline BP, immerse the hand for 1 minute, then follow recovery.',main:()=>main(),wire,ok:()=>has(0)&&has(30)&&has(60)&&[120,180,240,300,360].some(t=>has(t)),do:['Record baseline BP.','Immerse the hand to the wrist in ice water. Take BP at 30 s and at 60 s.','Withdraw the hand and take BP every minute until it returns to baseline.'],why:'Cold pain stimulates sympathetic outflow: arterioles constrict and heart rate rises, so BP climbs. A large rise suggests an exaggerated sympathetic response.',tips:['Record BP at the same arm position each time.']},
 {t:'Classify and viva',short:'Report',d:'Work out the rise in BP and classify.',main:()=>report(),do:['Peak minus baseline gives the pressor response.','Compare with the criteria in your manual.'],why:'Hyperreactors may be at higher risk of developing hypertension later.',tips:[],wire:()=>{$$('[data-d]').forEach(b=>b.onclick=()=>{V.ans=+b.dataset.d;K.redraw()});$$('[data-q]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.q.split('-');V.q[a]=+c;K.redraw()});const s=$('#sub');if(s)s.onclick=()=>{if(V.ans==null)return;V.done=1;K.redraw()};const g=$('#again');if(g)g.onclick=()=>{newSubject();K.step=0;K.redraw()}}}]});
newSubject();K.render();

</script>
<script>
(function(){
 var ID=document.documentElement.getAttribute('data-sim')||'';
 if(window.parent===window)return;
 document.documentElement.classList.add('emb');
 function theme(){try{var d=parent.document.documentElement.classList.contains('dark');document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}}
 theme();try{new MutationObserver(theme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 var last='';
 function post(){var h=document.documentElement.scrollHeight;parent.postMessage({qp:'height',h:h},'*');
  var s=document.querySelector('.score');if(s){var m=s.textContent.replace(/\s+/g,'').match(/^(\d+)\/(\d+)/);if(m){var k=m[1]+'/'+m[2];if(k!==last){last=k;parent.postMessage({qp:'score',tot:+m[1],max:+m[2]},'*')}}}}
 try{new MutationObserver(post).observe(document.body,{childList:true,subtree:true,attributes:true});new ResizeObserver(post).observe(document.body)}catch(e){}
 window.addEventListener('load',post);setTimeout(post,300);
})();
</script></body></html>

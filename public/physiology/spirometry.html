}

  --acc:#428bf0; --bd:#2b2b3b; --ok:#3fc58c; --bad:#f06a6a; --blue:#6aa2ff; --shadow:0 1px 2px #0006,0 10px 30px -14px #000;

.detail ol,.detail ul{margin:0 0 12px;padding-left:20px} .detail li{margin:4px 0;font-size:14px} .detail p{margin:0 0 12px;font-size:14px;color:var(--mfg)}
.coach{grid-template-columns:minmax(0,1fr) auto}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.opts{display:grid;gap:8px;margin-top:10px}

.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
@media(max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
.stage{background:linear-gradient(180deg,var(--scene),var(--scene2));border:1px solid var(--bd);border-radius:var(--r);padding:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.rtbox{min-height:220px;border-radius:16px;display:grid;place-items:center;text-align:center;padding:20px;background:var(--muted);color:var(--fg);font-size:22px;font-weight:700;border:2px dashed var(--bd);cursor:pointer;user-select:none;transition:background .05s}
.rtbox.wait{background:#fdecec;color:#a33;border-color:#e5484d} .rtbox.go{background:#3fb87f;color:#fff;border-color:#3fb87f} .rtbox.beep{background:#2f6df0;color:#fff;border-color:#2f6df0} .rtbox.bad{background:#fff1d6;color:#8a5b00;border-color:#f2c94c}
.pill:empty{display:none}
.chart{display:grid;gap:4px;justify-items:center;background:#fff;border-radius:12px;padding:12px;color:#111;transition:filter .2s}
.cl{display:flex;align-items:center;gap:14px;background:none;border:1px solid transparent;border-radius:8px;padding:0 10px;cursor:pointer;color:#111;font-family:Georgia,serif;font-weight:700;line-height:1.15}
.cl:hover{border-color:var(--bd)} .cl.on{border-color:var(--acc);background:#fff4e8}
.cl .den{font:600 11px Inter,sans-serif;color:#667;width:38px;text-align:left} .cl .lt{letter-spacing:.2em}
.say{min-height:58px;background:var(--muted);border-radius:12px;padding:12px 14px;font-size:15px}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const LEADS=['I','II','III','aVR','aVL','aVF','V1','V2','V3','V4','V5','V6'];
const LANG={I:0,II:60,III:120,aVR:-150,aVL:-30,aVF:90};
const CH={V1:{p:.06,q:0,r:.25,s:1.1,t:-.1},V2:{p:.08,q:0,r:.5,s:1.0,t:.35},V3:{p:.09,q:.02,r:.8,s:.7,t:.4},V4:{p:.1,q:.05,r:1.3,s:.35,t:.45},V5:{p:.1,q:.1,r:1.4,s:.1,t:.38},V6:{p:.09,q:.1,r:1.1,s:.05,t:.3}};
const RHY=[{k:'nsr',n:'Normal sinus rhythm',hr:[62,92],pr:.16},{k:'tachy',n:'Sinus tachycardia',hr:[108,135],pr:.14},{k:'brady',n:'Sinus bradycardia',hr:[42,54],pr:.18},{k:'af',n:'Atrial fibrillation',hr:[95,150],pr:0},{k:'avb1',n:'First-degree AV block',hr:[60,78],pr:.30}];
const AXES=[{k:'n',n:'Normal axis',a:[30,75]},{k:'lad',n:'Left axis deviation',a:[-60,-35]},{k:'rad',n:'Right axis deviation',a:[105,135]}];
let P,B;
const g=(d,c,s)=>Math.exp(-.5*((d-c)/s)**2);
function genBeats(){B=[];let t=-1.2;const rr0=60/P.hr;while(t<420){const af=P.rhythm.k==='af';const rr=af?rr0*(.5+.95*Math.random()):rr0*(1+(Math.random()-.5)*.04);t+=rr;B.push({t,rr,pr:P.rhythm.pr})}}
function newPatientData(forceNsr){const r=forceNsr?RHY[0]:pick(RHY),a=!forceNsr&&Math.random()>.6?pick(AXES.slice(1)):AXES[0];
  P={rhythm:r,axisK:a,axis:Math.round(rnd(a.a[0],a.a[1])),hr:forceNsr?75:Math.round(rnd(r.hr[0],r.hr[1]))};genBeats();return P}
function lb(t){let lo=0,hi=B.length;while(lo<hi){const m=(lo+hi)>>1;if(B[m].t<t)lo=m+1;else hi=m}return lo}
function params(l,axis){const ax=axis===undefined?P.axis:axis;if(LANG[l]===undefined)return CH[l];
  const a=LANG[l],v=Math.cos((ax-a)*Math.PI/180),d=x=>Math.cos(x*Math.PI/180);
  return{p:.15*d(60-a),q:v>.2?.07:0,r:Math.max(v,0)*1.25+.12,s:Math.max(-v,0)*1.1+.12,t:.35*d(45-a)}}
function beatVal(d,rr,pr,pm,af){let v=-pm.q*g(d,-.028,.008)+pm.r*g(d,0,.011)-pm.s*g(d,.026,.010)+pm.t*g(d,.17+.10*Math.sqrt(rr),.05);if(!af)v+=pm.p*g(d,-pr+.01,.022);return v}
function val(t,pm){let v=0,i=lb(t-.75);for(;i<B.length&&B[i].t<t+.45;i++){const b=B[i];v+=beatVal(t-b.t,b.rr,b.pr,pm,P.rhythm.k==='af')}
  v+=.03*Math.sin(6.28*.22*t);if(P.rhythm.k==='af')v+=.05*Math.sin(6.28*6*t)+.03*Math.sin(6.28*7.3*t+1);
  const n=Math.sin(Math.floor(t*400)*12.9898)*43758.5453;v+=.014*((n-Math.floor(n))-.5);return v}
function drawGrid(c,W,H,pxmm,off,bgc){
  c.fillStyle=bgc||'#fdeff1';c.fillRect(0,0,W,H);const base=W-off,a=((base%pxmm)+pxmm)%pxmm;
  for(let x=a;x<=W+1;x+=pxmm){const k=Math.round((x-base)/pxmm),M=((k%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(Math.round(x)+.5,0);c.lineTo(Math.round(x)+.5,H);c.stroke()}
  for(let j=-Math.ceil(H/2/pxmm);j<=Math.ceil(H/2/pxmm);j++){const y=H/2+j*pxmm,M=((j%5)+5)%5===0;c.strokeStyle=M?'#e48a9d':'#f4c3cc';c.lineWidth=M?1.1:.6;c.beginPath();c.moveTo(0,Math.round(y)+.5);c.lineTo(W,Math.round(y)+.5);c.stroke()}}
function fitCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,W:r.width,H:r.height}}

/* Shared stepper for every practical. Each simulator passes steps with: t, d, do[], why, tips[], ok(), body(), main(), wire(), msg(). */
function Kit(cfg){
  const app=$('#app');
  app.innerHTML=`<div class="wrap"><header><div><div class="eyebrow">Physiology practical · Virtual lab</div><h1>${cfg.title}</h1><p class="sub">${cfg.sub}</p></div><div class="pill" id="pt"></div></header>
  <div class="steps" id="steps"></div><div id="main"></div>
  <div class="card coach" style="margin-top:18px"><div><div class="pill" id="stepTag"></div><h2 id="cTitle" style="margin-top:8px"></h2><div class="mut" id="cText"></div><div class="msg" id="cMsg"></div><div id="cBody"></div></div>
  <div class="row"><button class="btn" id="back">Back</button><button class="btn pri" id="next">Next</button></div></div></div>`;
  const K={step:0,cfg};
  const det=s=>s.do?`<div class="detail"><div><h3>What to do</h3><ol>${s.do.map(x=>`<li>${x}</li>`).join('')}</ol></div><div><h3>Why it matters</h3><p>${s.why||''}</p>${s.tips&&s.tips.length?`<h3>Examiner's tips</h3><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div></div>`:'';
  K.render=function(keepMain){
    const S=cfg.steps,st=S[K.step];
    $('#steps').innerHTML=S.map((s,i)=>`<div class="st ${i===K.step?'on':i<K.step?'done':''}"><b>${i<K.step?'✓':i+1}</b>${s.short||s.t}</div>`).join('');
    $('#stepTag').textContent=`Step ${K.step+1} of ${S.length}`;$('#cTitle').textContent=st.t;$('#cText').textContent=st.d||'';
    $('#cBody').innerHTML=(st.body?st.body():'')+det(st);
    if(!keepMain){$('#main').innerHTML=st.main?st.main():'';}
    const last=K.step===S.length-1;$('#back').disabled=K.step===0||(st.lockBack&&st.lockBack());$('#next').hidden=last&&!st.next;$('#next').disabled=!(st.ok?st.ok():true);
    const m=st.msg?st.msg():null,el=$('#cMsg');el.className='msg'+(m&&m[1]?' '+m[1]:'');el.textContent=m?m[0]:'';
    if(!keepMain&&st.wire)st.wire();if(st.after)st.after();
  };
  $('#next').addEventListener('click',()=>{const st=cfg.steps[K.step];if(st.ok&&!st.ok())return;if(st.leave)st.leave();K.step++;K.render()});
  $('#back').addEventListener('click',()=>{if(K.step>0){K.step--;K.render()}});
  K.refresh=()=>K.render(true);K.redraw=()=>K.render(false);
  return K;
}
Kit.score=(items,again)=>{const tot=items.reduce((a,i)=>a+i[0],0),mx=items.reduce((a,i)=>a+i[1],0);
  return `<div class="score" style="margin-top:18px">${tot}<small> / ${mx}</small></div><div class="checks">${items.map(([p,m,t])=>`<div class="ck"><span class="${p>=m?'ok':'bad'}">${p>=m?'✓':'✗'}</span><span>${t}${m>1?` (${p} of ${m})`:''}</span></div>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="again">New subject</button></div>`};
const chipRow=(items,state,key)=>`<div class="row" style="margin-top:12px">${items.map(([k,l])=>`<button class="chip" data-chip="${k}" aria-pressed="${!!state[k]}">${l}</button>`).join('')}</div>`;
const wireChips=(state,cb)=>$$('[data-chip]').forEach(b=>b.addEventListener('click',()=>{state[b.dataset.chip]=!state[b.dataset.chip];cb()}));
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const NAMES=['Ravi K.','Sneha P.','Imran S.','Anita R.','Mahesh D.','Farah N.','Kiran B.','Lakshmi T.'];
let AC;document.addEventListener('pointerdown',()=>{if(!AC)try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}},{once:true});
function tone(f,dur,gain){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(gain||.2,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur+.02)}catch(e){}}

const PRE=[['sit','Seat the subject upright, nose clip on'],['mp','Use a fresh sterile mouthpiece / filter'],['dem','Record height, weight and age'],['expl','Demonstrate the manoeuvre and explain it']];
const TYPES=[{n:'Normal',TV:500,IRV:3000,ERV:1100,fvc:4600,ratio:.83,dx:'Normal'},{n:'Obstructive',TV:600,IRV:2300,ERV:900,fvc:3800,ratio:.48,dx:'Obstructive'},{n:'Restrictive',TV:400,IRV:1500,ERV:700,fvc:2600,ratio:.88,dx:'Restrictive'}];
let V,tr,seg,tmr,fo;const MC=[['The FEV1/FVC ratio is reduced in…',['Obstructive disease','Restrictive disease','Both equally'],0],['Which volume CANNOT be measured by simple spirometry?',['Residual volume','Vital capacity','Tidal volume'],0]];
const cs=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function newSubject(){const T=pick(TYPES),j=()=>1+rnd(-.05,.05);V={prep:{},T,name:pick(NAMES),age:Math.round(rnd(20,55)),ht:Math.round(rnd(155,182)),m:{},f:{},dx:null,q:{},done:0};
 V.TV=Math.round(T.TV*j());V.IRV=Math.round(T.IRV*j());V.ERV=Math.round(T.ERV*j());V.VC=V.TV+V.IRV+V.ERV;V.FVC=Math.round(V.VC*1.0);V.FEV1=Math.round(V.FVC*T.ratio*j()>V.FVC?V.FVC*T.ratio:V.FVC*T.ratio*j());
 V.tau=-1/Math.log(1-V.FEV1/V.FVC);V.pred=Math.round(V.ht*30-2600+rnd(-80,80));
 tr=[];seg='idle';fo=null;clearInterval(tmr);$('#pt').textContent=`Subject: ${V.name} · ${V.age} y · ${V.ht} cm`}
// spirogram: volume above residual volume, in mL; sampled at 10 Hz
const FRC=()=>V.ERV,EI=()=>V.ERV+V.TV,TLC=()=>V.VC;
let phase=0,t0=0,cur=0,tgt=0;
function startRec(){cur=FRC();tr=[cur];phase=0;clearInterval(tmr);seg='tidal';tmr=setInterval(step,50)}
function step(){let v;const dt=.05;phase+=dt;if(seg==='tidal'){v=FRC()+V.TV/2*(1-Math.cos(phase*2*Math.PI/4));cur=v}else{const sp=seg==='insp'?(TLC()-cur)*.18+40:(cur-0)*.12+40;cur+=Math.sign(tgt-cur)*Math.min(Math.abs(tgt-cur),sp*0.6);if(seg==='insp'&&cur>=TLC()-2&&!V.m.reachedTLC){V.m.reachedTLC=1}}
 tr.push(cur);if(tr.length>400)tr.shift();drawSpiro()}
function setSeg(s){if(s==='insp'){seg='insp';tgt=TLC()}else if(s==='exp'){seg='exp';tgt=0}else{seg='tidal';phase=Math.acos(1-2*(cur-FRC())/V.TV)/(2*Math.PI/4)||0;if(cur<FRC()||cur>EI()){seg='tidal';phase=0;cur=FRC()}}}
function grid(c,W,H,x0,y0,x1,y1,ymax,xmax,ylab,xlab){c.clearRect(0,0,W,H);c.fillStyle=cs('--card');c.fillRect(0,0,W,H);c.font='11px Inter';c.fillStyle=cs('--mfg');c.strokeStyle=cs('--bd');c.lineWidth=1;
 for(let y=0;y<=ymax;y+=ymax>5000?1000:500){const Y=y1-(y1-y0)*y/ymax;c.beginPath();c.moveTo(x0,Y);c.lineTo(x1,Y);c.stroke();c.textAlign='right';c.fillText(y,x0-6,Y+4)}
 const xs=xmax>10?5:1;for(let x=0;x<=xmax;x+=xs){const X=x0+(x1-x0)*x/xmax;c.beginPath();c.moveTo(X,y0);c.lineTo(X,y1);c.stroke();c.textAlign='center';c.fillText(x,X,y1+16)}
 c.save();c.translate(10,(y0+y1)/2);c.rotate(-Math.PI/2);c.textAlign='center';c.fillText(ylab,0,0);c.restore();c.textAlign='center';c.fillText(xlab,(x0+x1)/2,H-4)}
function drawSpiro(){const cv=$('#sg');if(!cv)return;const{c,W,H}=fitCanvas(cv);const x0=64,x1=W-12,y0=12,y1=H-30,ym=6000;grid(c,W,H,x0,y0,x1,y1,ym,40,'Volume (mL)','Time (s)');
 c.strokeStyle=cs('--acc');c.lineWidth=2.4;c.lineJoin='round';c.beginPath();tr.forEach((v,i)=>{const X=x0+(x1-x0)*i/400,Y=y1-(y1-y0)*v/ym;i?c.lineTo(X,Y):c.moveTo(X,Y)});c.stroke();
 if(cv._hx!=null){const X=cv._hx,i=Math.round((X-x0)/(x1-x0)*400),v=tr[i];c.strokeStyle=cs('--pri');c.setLineDash([4,4]);c.beginPath();c.moveTo(X,y0);c.lineTo(X,y1);c.stroke();c.setLineDash([]);if(v!=null){$('#rd').textContent=`Volume at cursor: ${Math.round(v)} mL`}}}
function curveFV(t){return t<=0?0:V.FVC*(1-Math.exp(-t/V.tau))*Math.min(1,t/.08)**.5}
function drawFvc(){const cv=$('#fv');if(!cv)return;const{c,W,H}=fitCanvas(cv);const x0=64,x1=W-12,y0=12,y1=H-30,ym=6000;grid(c,W,H,x0,y0,x1,y1,ym,6,'Volume (mL)','Time (s)');
 const n=Math.min(fo?fo.t:0,6);c.strokeStyle=cs('--acc');c.lineWidth=2.6;c.beginPath();for(let t=0;t<=n;t+=.02){const X=x0+(x1-x0)*t/6,Y=y1-(y1-y0)*curveFV(t)/ym;t?c.lineTo(X,Y):c.moveTo(X,Y)}c.stroke();
 if(cv._hx!=null){const X=cv._hx,t=Math.round((X-x0)/(x1-x0)*600)/100;c.strokeStyle=cs('--pri');c.setLineDash([4,4]);c.beginPath();c.moveTo(X,y0);c.lineTo(X,y1);c.stroke();c.setLineDash([]);if(t<=n)$('#rd2').textContent=`At ${t.toFixed(2)} s: ${Math.round(curveFV(t))} mL`}
 const f=$('#fl');if(f&&fo){const o=fitCanvas(f),g=o.c;g.clearRect(0,0,o.W,o.H);g.fillStyle=cs('--card');g.fillRect(0,0,o.W,o.H);const a0=36,a1=o.W-10,b0=10,b1=o.H-26,pk=Math.max(...Array.from({length:600},(_,i)=>(curveFV((i+1)/100)-curveFV(i/100))*100));
  g.strokeStyle=cs('--bd');g.beginPath();g.moveTo(a0,b1-(b1-b0)*.28);g.lineTo(a1,b1-(b1-b0)*.28);g.stroke();g.fillStyle=cs('--mfg');g.font='11px Inter';g.textAlign='center';g.fillText('Volume exhaled (mL) →',(a0+a1)/2,o.H-6);g.textAlign='left';g.fillText('Flow',4,12);
  g.strokeStyle=cs('--acc');g.lineWidth=2.4;g.beginPath();let first=1;for(let t=0;t<=n;t+=.02){const fl=(curveFV(t+.01)-curveFV(t))*100,X=a0+(a1-a0)*curveFV(t)/V.FVC,Y=b1-(b1-b0)*.28-(b1-b0)*.68*fl/pk;first?(g.moveTo(X,Y),first=0):g.lineTo(X,Y)}g.stroke();
  if(n>=6){g.strokeStyle=cs('--blue');g.beginPath();for(let i=0;i<=40;i++){const x=i/40,X=a1-(a1-a0)*x,Y=b1-(b1-b0)*.28+(b1-b0)*.26*Math.sin(Math.PI*x)*.9;i?g.lineTo(X,Y):g.moveTo(X,Y)}g.stroke()}}}
function hover(id,fn){const cv=$(id);if(!cv)return;cv.onpointermove=e=>{const r=cv.getBoundingClientRect();cv._hx=e.clientX-r.left;fn()};cv.onpointerleave=()=>{cv._hx=null;fn()}}
const num=(k,l,o)=>`<div><span class="lab">${l}</span><input type="number" inputmode="numeric" data-n="${o}.${k}" value="${V[o][k]??''}" ${V.done?'disabled':''}></div>`;
function s2(){return `<div class="stage"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="pill">Spirogram</span><span class="mut" id="rd">Move the cursor over the trace to read volume.</span></div><canvas id="sg" style="width:100%;height:300px;display:block"></canvas>
 <div class="row" style="margin-top:12px"><button class="btn acc" id="rec">${tr.length?'Restart recording':'Start recording'}</button><button class="btn" id="ins" ${!tr.length?'disabled':''}>Maximal inspiration</button><button class="btn" id="exh" ${!tr.length?'disabled':''}>Maximal expiration</button><button class="btn" id="tid" ${!tr.length?'disabled':''}>Quiet breathing</button></div>
 <div class="panel" style="margin-top:12px"><span class="lab">Read from the trace (mL)</span><div class="two">${num('TV','Tidal volume (TV)','m')}${num('IRV','Inspiratory reserve (IRV)','m')}</div><div class="two" style="margin-top:8px">${num('ERV','Expiratory reserve (ERV)','m')}${num('VC','Vital capacity (VC)','m')}</div><p class="mut">Residual volume cannot be seen on this trace; the zero is the end of a maximal expiration.</p></div></div>`}
function s3(){return `<div class="stage"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="pill">Forced expiration</span><span class="mut" id="rd2">Hover to read the volume at a time.</span></div><canvas id="fv" style="width:100%;height:240px;display:block"></canvas><canvas id="fl" style="width:100%;height:150px;display:block;margin-top:8px"></canvas>
 <div class="row" style="margin-top:12px"><button class="btn acc" id="fo">Blow out as hard and fast as possible</button></div>
 <div class="panel" style="margin-top:12px"><div class="two">${num('FVC','FVC (mL)','f')}${num('FEV1','FEV1 at 1 s (mL)','f')}</div><div class="row" style="margin-top:8px"><span class="mut">FEV1/FVC = <b>${V.f.FVC&&V.f.FEV1?Math.round(V.f.FEV1/V.f.FVC*100)+'%':'-'}</b> (normal is above 70-75%)</span></div></div></div>`}
function wirenum(){$$('[data-n]').forEach(i=>i.oninput=()=>{const[o,k]=i.dataset.n.split('.');V[o][k]=i.value===''?null:+i.value;K.refresh()})}
function s4(){const r=V.f.FVC&&V.f.FEV1?Math.round(V.f.FEV1/V.f.FVC*100):0;return `<div class="panel"><div class="eyebrow">Your results</div><h2>${V.name}</h2><div class="scroll"><table><tr><th>Measure</th><th>Value</th></tr><tr><td>TV / IRV / ERV</td><td>${V.m.TV} / ${V.m.IRV} / ${V.m.ERV} mL</td></tr><tr><td>VC</td><td>${V.m.VC} mL</td></tr><tr><td>FVC</td><td>${V.f.FVC} mL</td></tr><tr><td>FEV1</td><td>${V.f.FEV1} mL</td></tr><tr><td>FEV1/FVC</td><td>${r}%</td></tr><tr><td>Predicted FVC (approx.)</td><td>${V.pred+1900} mL</td></tr></table></div>
 <span class="lab" style="margin-top:12px">Pattern</span><div class="row">${TYPES.map((t,i)=>`<button class="chip" data-d="${i}" aria-pressed="${V.dx===i}" ${V.done?'disabled':''}>${t.n}</button>`).join('')}</div>
 ${MC.map((q,i)=>`<div style="margin-top:12px"><span class="lab">${q[0]}</span><div class="row">${q[1].map((o,j)=>`<button class="chip" data-q="${i}-${j}" aria-pressed="${V.q[i]===j}" ${V.done?'disabled':''}>${o}</button>`).join('')}</div></div>`).join('')}
 <div class="row" style="margin-top:14px"><button class="btn acc" id="sub" ${V.done?'disabled':''}>Submit to examiner</button></div>${V.done?sc():''}</div>`}
const near=(a,b,p)=>a!=null&&Math.abs(a-b)<=b*p;
function sc(){const prep=PRE.filter(([k])=>V.prep[k]).length,vol=['TV','IRV','ERV','VC'].filter(k=>near(V.m[k],V[k],.15)).length>=3?2:0,fo=(near(V.f.FVC,V.FVC,.08)&&near(V.f.FEV1,V.FEV1,.1))?2:0,d=TYPES[V.dx].n===V.T.n?2:0,q=MC.filter((x,i)=>V.q[i]===x[2]).length>=2?1:0;
 return Kit.score([[prep,4,'Preparation'],[vol,2,'Lung volumes read correctly'],[fo,2,'FVC and FEV1 read correctly'],[d,2,'Pattern identified'],[q,1,'Viva questions']])+`<p class="mut" style="margin-top:12px">True values: TV ${V.TV}, IRV ${V.IRV}, ERV ${V.ERV}, VC ${V.VC}, FEV1 ${V.FEV1} mL, FEV1/FVC ${Math.round(V.FEV1/V.FVC*100)}%. Subject was <b>${V.T.n}</b>. Obstructive: FEV1/FVC low, FVC normal or reduced. Restrictive: FEV1/FVC normal or high, FVC low.</p>`}
const K=Kit({title:'Spirometry and Lung Volumes',sub:'Record a spirogram, read the lung volumes, then perform a forced expiration and interpret the pattern.',steps:[
 {t:'Prepare the subject and spirometer',short:'Prepare',d:'Hygiene, posture and demonstration.',ok:()=>PRE.every(([k])=>V.prep[k]),body:()=>chipRow(PRE,V.prep),wire:()=>wireChips(V.prep,()=>K.refresh()),do:['Record age, height and weight; predicted values depend on them.','Seat the subject upright and apply the nose clip.','Use a clean mouthpiece or bacterial filter.','Demonstrate: a tight seal, maximal inspiration, then blast out.'],why:'Poor technique (air leaks, slow start, not blowing to the end) under-reads every volume.',tips:['Do at least three acceptable efforts. Report the best.']},
 {t:'Record the spirogram',short:'Volumes',d:'Quiet breathing, then a maximal breath in and a maximal breath out.',main:()=>s2(),wire:()=>{wirenum();$('#rec').onclick=()=>{startRec();K.redraw()};$('#ins').onclick=()=>setSeg('insp');$('#exh').onclick=()=>setSeg('exp');$('#tid').onclick=()=>setSeg('tidal');hover('#sg',drawSpiro);drawSpiro()},leave:()=>clearInterval(tmr),ok:()=>['TV','IRV','ERV','VC'].every(k=>V.m[k]!=null),
  do:['Start recording and let the subject breathe quietly for a few breaths. Read the tidal volume (peak to trough).','At end of a quiet breath in, ask for a maximal inspiration: the extra volume is IRV.','Then a maximal expiration to the bottom: the volume from the end of a quiet breath out is ERV.','VC is the distance from the top to the bottom of the maximal breath (TV + IRV + ERV).'],why:'Spirometry measures volumes of air moved, not the air left behind. RV, FRC and TLC need helium dilution or body plethysmography.',tips:['Normal adults: TV about 500 mL, IRV 3000, ERV 1100, VC 4500-5000 mL.']},
 {t:'Forced vital capacity',short:'FVC / FEV1',d:'Perform a forced expiration and read FVC and FEV1.',main:()=>s3(),wire:()=>{wirenum();$('#fo').onclick=()=>{fo={t:0};clearInterval(tmr);tmr=setInterval(()=>{fo.t+=.1;drawFvc();if(fo.t>=6.2)clearInterval(tmr)},50)};hover('#fv',drawFvc);drawFvc()},leave:()=>clearInterval(tmr),ok:()=>V.f.FVC!=null&&V.f.FEV1!=null,
  do:['Ask for a full breath in, then blast out hard and fast and keep going until empty (at least 6 seconds).','Read FVC at the plateau.','Read FEV1 at 1 second. Hover over the curve at t = 1.00 s.','Work out FEV1/FVC as a percentage.'],why:'In obstruction, airways narrow and air leaves slowly: FEV1 falls more than FVC, so the ratio drops. In restriction both fall in proportion.',tips:['The flow-volume loop shows the peak flow (PEFR) early, then flow falling as the lungs empty.']},
 {t:'Interpret',short:'Report',d:'Decide the pattern and answer the viva questions.',main:()=>s4(),do:['Compare FEV1/FVC with 70-75%.','Compare FVC with the predicted value.'],why:'Ratio low = obstructive. Ratio normal with FVC low = restrictive.',tips:[],wire:()=>{$$('[data-d]').forEach(b=>b.onclick=()=>{V.dx=+b.dataset.d;K.redraw()});$$('[data-q]').forEach(b=>b.onclick=()=>{const[a,c]=b.dataset.q.split('-');V.q[a]=+c;K.redraw()});const s=$('#sub');if(s)s.onclick=()=>{if(V.dx==null)return;V.done=1;K.redraw()};const g=$('#again');if(g)g.onclick=()=>{newSubject();K.step=0;K.redraw()}}}]});
newSubject();K.render();

</script>
<script>
(function(){
 var ID=document.documentElement.getAttribute('data-sim')||'';
 if(window.parent===window)return;
 document.documentElement.classList.add('emb');
 function theme(){try{var d=parent.document.documentElement.classList.contains('dark');document.documentElement.setAttribute('data-theme',d?'dark':'light')}catch(e){}}
 theme();try{new MutationObserver(theme).observe(parent.document.documentElement,{attributes:true,attributeFilter:['class']})}catch(e){}
 var last='';
 function post(){var h=document.documentElement.scrollHeight;parent.postMessage({qp:'height',h:h},'*');
  var s=document.querySelector('.score');if(s){var m=s.textContent.replace(/\s+/g,'').match(/^(\d+)\/(\d+)/);if(m){var k=m[1]+'/'+m[2];if(k!==last){last=k;parent.postMessage({qp:'score',tot:+m[1],max:+m[2]},'*')}}}}
 try{new MutationObserver(post).observe(document.body,{childList:true,subtree:true,attributes:true});new ResizeObserver(post).observe(document.body)}catch(e){}
 window.addEventListener('load',post);setTimeout(post,300);
})();
</script></body></html>
